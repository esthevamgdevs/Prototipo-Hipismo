# Dependabot: abre um pedido de atualização (Pull Request) quando sair versão nova
# das dependências do coletor ou das ações do GitHub. Você revisa e aprova pelo site.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/scripts/hipica"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
