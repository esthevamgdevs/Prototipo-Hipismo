name: Coletar dados do hipismo (FPH)

on:
  schedule:
    # Horários em UTC (Brasília = UTC-3).
    - cron: "17 12,17,21,0 * * *"   # coleta completa: 9h, 14h, 18h e 21h em Brasília
    - cron: "*/10 10-23 * * *"      # coleta rápida a cada 10 min, das 7h às 21h em Brasília (horário das provas)
    - cron: "17 1-9 * * *"          # coleta rápida de hora em hora durante a madrugada
  workflow_dispatch:          # botão "Run workflow" pra rodar na hora

# Só o necessário: gravar os dados no repositório.
permissions:
  contents: write

concurrency:
  group: coleta-hipica
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Ações fixadas pelo código do commit (não mudam sozinhas). O token do GitHub NÃO fica
      # gravado na pasta .git: só o passo "Salvar dados" usa o token, e só na hora do envio.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Instala exatamente as versões do package-lock.json, sem rodar scripts de instalação dos pacotes.
      - name: Instalar dependências
        working-directory: scripts/hipica
        run: npm ci --ignore-scripts --no-audit --no-fund

      # A coleta não recebe nenhuma chave: só lê o site da FPH e grava em data/hipica.
      - name: Coletar calendário e resultados
        working-directory: scripts/hipica
        timeout-minutes: 35
        env:
          MODO: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 12,17,21,0 * * *') && 'completo' || 'rapido' }}
        run: node coletar.mjs

      # Se você subir arquivos pelo site durante a coleta, o pull --rebase junta as duas coisas
      # antes de enviar, e tenta de novo até 3 vezes. Assim a rodada não se perde.
      - name: Salvar dados no repositório
        id: salvar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hipica
          if git diff --cached --quiet; then
            echo "Nenhuma novidade desta vez."
            echo "mudou=nao" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "Atualiza dados do hipismo"
          DESTINO="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for tentativa in 1 2 3; do
            if git pull -q --rebase "$DESTINO" "$GITHUB_REF_NAME" && git push -q "$DESTINO" "HEAD:$GITHUB_REF_NAME"; then
              echo "Dados salvos (tentativa $tentativa)."
              echo "mudou=sim" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Envio recusado na tentativa $tentativa. Nova tentativa em 15 s…"
            sleep 15
          done
          echo "::error::Não deu para salvar os dados depois de 3 tentativas."
          exit 1

      # Avisos rodam por último, com as chaves do Supabase e VAPID só neste passo.
      # Se demorar ou falhar, os dados da coleta já estão salvos.
      - name: Enviar avisos
        if: steps.salvar.outputs.mudou == 'sim'
        working-directory: scripts/hipica
        timeout-minutes: 8
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: node enviar-avisos.mjs
