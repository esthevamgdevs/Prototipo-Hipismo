    ${sec('O que conta', `<p><b>Vitória</b> é o 1º lugar numa prova; <b>pódio</b> é do 1º ao 3º. Entram todas as provas com resultado publicado, de qualquer altura. Conjuntos eliminados ou desistentes contam como largada, mas não como pódio. Empates na mesma colocação contam para todos os empatados.</p>`)}
    ${sec('Garanhões, matrizes e criadores', `<p>Cada cavalo soma para o seu pai, para a sua mãe e para o seu criador, conforme a ficha. A ordem é pelas vitórias dos cavalos em pista; em caso de empate, pelos pódios, depois pelo número de cavalos e depois pelas largadas. ${cob ? `Hoje, ${cob} cavalos da temporada têm ficha; os demais ainda não entram nesses rankings.` : ''}</p>
      <p>O destaque <b>pódio a ${a}+</b> marca o cavalo que ficou entre os três primeiros em pelo menos uma prova de ${a} ou mais. É um critério do Salta; o selo oficial de <i>black type</i> é da ABCCH.</p>`)}
    ${sec('Ranking mundial WBFSH', `<p>A posição mundial é a publicada pela WBFSH${S.wbfsh && S.wbfsh.periodo ? `, com ${esc(S.wbfsh.periodo)}` : ''}. O Salta não recalcula esse ranking. Como os nomes são escritos de forma diferente, cada garanhão só recebe o selo quando a ligação é por nome igual, por nome sem o número de registro ou por grafia conhecida da FPH; casos parecidos ficam de fora até serem conferidos.</p>`)}
    ${sec('Identificação dos cavalos', `<p>Os cavalos são identificados pelo nome, porque os resultados públicos não trazem o número de registro. Homônimos e mudanças de afixo podem causar erros, e por isso os casos duvidosos ficam fora das contagens até serem confirmados.</p>`)}

    <p class="fonte">Rankings e resumos são calculados pelo Salta e não são rankings oficiais da FPH, da CBH, da ABCCH ou da WBFSH.</p>
  </main>`;
}

      <div class="campeao-nums"><span><b>${faltas}</b><small>faltas</small></span>${ult[1] ? `<span><b>${String(ult[1]).replace('.', ',')}s</b><small>${fases.length > 1 ? 'desempate' : 'percurso'}</small></span>` : ''}<span><b>${linhas.length}</b><small>conjuntos</small></span></div>
    </div>

  </div>`;

// ---------- compartilhar ----------
function cartaoSVG() {
  const t = achar(S.torneio), p = t.provas.find(x => x.id === +S.prova), dados = S.torneios[t.id];
  const linhas = dados?.provas?.[String(p.id)] || [];
  const c = linhas.find(l => l.p === 1);
  if (!c) return '';
  const perc = c.r?.[0], des = c.r?.length > 1 ? c.r[c.r.length - 1] : null;
  const x = p.dia ? dt(p.dia) : null;
  const quebra = (s, max) => {
    const out = []; let linha = '';
    for (const w of String(s).split(/\s+/)) { if ((linha + ' ' + w).trim().length > max) { out.push(linha.trim()); linha = w; } else linha += ' ' + w; }
    if (linha.trim()) out.push(linha.trim());
    return out.slice(0, 2);
  };
  const nome = quebra(titulo(c.c), 22);

function folhaCompartilhar() {
  if (!S.compartilhar) return '';
  return `<div class="folha" data-acao="fecharFolha"><div class="caixa" role="dialog" aria-label="Compartilhar resultado">

  </div></div>`;

function baixarCard() {
  const svgEl = document.querySelector('#cartaoArea svg');
  if (!svgEl) return;
  const texto = new XMLSerializer().serializeToString(svgEl);
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = 1080; c.height = 1920;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#123D30'; ctx.fillRect(0, 0, 1080, 1920);
    ctx.drawImage(img, 0, 0, 1080, 1920);
    c.toBlob(b => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = 'pista-campeao.png';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }, 'image/png');
  };
  img.onerror = () => alert('Não foi possível gerar a imagem neste navegador. Você pode tirar um print do card.');
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(texto);
}

const app = document.getElementById('app');
// caminho de navegação entre perfis, provas e páginas de criação, para o Voltar refazer o trajeto
function guardarCaminho() {
  const campos = ['tela', 'torneio', 'prova', 'dia', 'abaProva', 'perfilTipo', 'perfilK', 'garanhaoK', 'matrizK', 'harasK'];
  const foto = { y: window.scrollY }; for (const c of campos) foto[c] = S[c];
  S.pilha = [...(S.pilha || []), foto];
}
function voltarCaminho() {
  const ant = (S.pilha || []).pop();
  if (!ant) return irPara(null, { torneio: null, prova: null });
  const { y, ...resto } = ant;
  Object.assign(S, resto);
  if (S.tela === 'perfil' && S.perfilTipo) carregarPerfil(S.perfilTipo, S.perfilK);
  render(); window.scrollTo(0, y || 0);
}
function ajustarChips() {
  for (const fila of document.querySelectorAll('.capa .chips')) {
    const sobra = fila.scrollWidth - fila.clientWidth;
    fila.classList.toggle('rola', sobra > 4);
    const ativo = fila.querySelector('[aria-pressed="true"]');
    if (ativo && sobra > 4) {
      const alvo = ativo.offsetLeft - (fila.clientWidth - ativo.offsetWidth) / 2;
      fila.scrollLeft = Math.max(0, Math.min(sobra, alvo));
    }
    fila.classList.toggle('no-fim', fila.scrollLeft >= sobra - 4);
    fila.onscroll = () => fila.classList.toggle('no-fim', fila.scrollLeft >= fila.scrollWidth - fila.clientWidth - 4);
  }
}
function render() {
  let html;
  if (S.erro) {
    html = `<header class="capa"><span class="marca">${marcaSvg(26)}Salta<small>by Opportunity</small></span></header><main><div class="vazio">${

function irPara(tela, extra = {}) { Object.assign(S, { tela }, extra); window.scrollTo(0, 0); render(); }

document.addEventListener('click', e => {
  const alvo = e.target.closest('[data-aba],[data-aba-prova],[data-acao],[data-torneio],[data-prova],[data-perfil],[data-cat],[data-dia],[data-rank],[data-aviso],[data-opp-vista],[data-abrir-prova],[data-tr],[data-bv-rever],[data-garanhao],[data-haras],[data-matriz],[data-hist-prova],[data-aba-perfil]');
  if (!alvo) return;
  const d = alvo.dataset;
  if (d.acao === 'fecharFolha' && e.target.closest('.caixa') && !e.target.closest('[data-acao="fecharFolha"]')) return;
  if (d.aba) { Object.assign(S, { aba: d.aba, tela: null, torneio: null, prova: null, origem: null, pilha: [] }); window.scrollTo(0, 0); return render(); }
  if (d.acao === 'salvar') return alternar(salvos, 'pista-salvos', +d.id);
  if (d.acao === 'seguir') return seguir(d.tipo, d.k, d.nome);
  if (d.acao === 'salvos') { S.soSalvos = !S.soSalvos; return render(); }
  if (d.acao === 'limpar') { Object.assign(S, { cat: 'Todas', altura: 'todas', soSalvos: false }); return render(); }
  if (d.acao === 'sobre') return irPara('sobre');
  if (d.acao === 'voltarSobre') return irPara(null);
  if (d.acao === 'voltarLista') return irPara(null, { torneio: null });
  if (d.acao === 'voltarTorneio') {
    if (S.pilha && S.pilha.length && S.tela === 'prova') return voltarCaminho();
    if (S.origem === 'opp') { S.origem = null; return irPara(null, { torneio: null, prova: null, filtro: '' }); }
    return irPara('torneio', { prova: null, filtro: '' });
  }
  if (d.acao === 'voltarPerfil') {
    if (S.pilha && S.pilha.length) return voltarCaminho();
    return irPara(S.prova ? 'prova' : (S.torneio ? 'torneio' : null), { perfilTipo: null, perfilK: null });
  }
  if (d.acao === 'recarregar') { S.erro = null; S.dados = null; render(); return carregar(); }
  if (d.acao === 'recarregarProva') { delete S.torneios[S.torneio]; return render(); }
  if (d.acao === 'compartilhar') { S.campeao = false; S.compartilhar = cartaoSVG(); return render(); }
  if (d.acao === 'verCampeao') { S.campeao = true; return render(); }
  if (d.acao === 'fecharCampeao') { S.campeao = false; return render(); }
  if (d.acao === 'fecharFolha') { S.compartilhar = null; return render(); }
  if (d.acao === 'baixarCard') return baixarCard();
  if (d.aviso) { avisos[d.aviso] = !avisos[d.aviso]; guarda.gravar('pista-avisos', avisos); sincronizarAvisos(); return render(); }
  if (d.acao === 'ativarAvisos') return ativarAvisos();
  if (d.bvRever) return mostrarBoasVindas(0);
  if (d.acao === 'desativarAvisos') return desativarAvisos();
  if (d.cat) { S.cat = d.cat; return render(); }
  if (d.dia) { S.dia = d.dia; return render(); }
  if (d.rank) { S.rankTipo = d.rank === 'opp' ? 'cavaleiros' : d.rank; return render(); }
  if (d.oppVista) { S.oppVista = d.oppVista; return render(); }
  if (d.abaPerfil) { S.abaPerfil = d.abaPerfil; return render(); }
  if (d.garanhao || d.haras || d.matriz) {
    guardarCaminho();
    if (S.haras === undefined) carregarArquivo('haras', 'haras.json');
    if (d.garanhao) return irPara('garanhao', { garanhaoK: d.garanhao });
    if (d.matriz) return irPara('matriz', { matrizK: d.matriz });
    return irPara('haras', { harasK: d.haras });
  }
  if (d.histProva) {
    const [ti, pid] = d.histProva.split(':').map(Number);
    guardarCaminho();
    return irPara('prova', { torneio: ti, prova: pid, dia: null, filtro: '', abaProva: 'classificacao' });
  }
  if (d.acao === 'metodo') { guardarCaminho(); return irPara('metodo', {}); }
  if (d.acao === 'voltarMetodo') return voltarCaminho();
  if (d.acao === 'voltarCriacao') return voltarCaminho();
  if (d.tr) { S.trIdx = +d.tr; S.trTocando = false; return render(); }
  if (d.acao === 'tocarTransmissao') { S.trTocando = true; return render(); }
  if (d.acao === 'verTransmissao') {
    const lista = transmissoesDe(achar(S.torneio));
    const hoje = lista.findIndex(x => x.dia === hojeISO());
    Object.assign(S, { trTorneio: S.torneio, trIdx: hoje >= 0 ? hoje : 0, trTocando: true });
    return irPara('torneio', { prova: null, filtro: '' });
  }
  if (d.abrirProva) {
    const [ti, ref] = d.abrirProva.split(':');
    S.origem = 'opp';
    return irPara('prova', { torneio: +ti, prova: /^\d+$/.test(ref) ? +ref : ref, dia: null, filtro: '', abaProva: 'classificacao' });
  }
  if (d.abaProva) { S.abaProva = d.abaProva; S.filtro = ''; return render(); }
  if (d.prova) return irPara('prova', { prova: /^\d+$/.test(d.prova) ? +d.prova : d.prova, filtro: '', abaProva: 'classificacao' });
  if (d.perfil) {
    // vindo de uma página de criação, de outro perfil ou de uma prova aberta pelo perfil, o Voltar retorna para lá
    if (['garanhao', 'haras', 'matriz', 'perfil', 'metodo'].includes(S.tela) || (S.tela === 'prova' && S.pilha && S.pilha.length)) guardarCaminho();
    carregarPerfil(d.perfil, d.k); return irPara('perfil', { perfilTipo: d.perfil, perfilK: d.k, abaPerfil: 'momentos' });
  }
  if (d.torneio) return irPara('torneio', { torneio: +d.torneio, dia: null, prova: null });
});

  const linhas = dados?.provas?.[String(S.prova)] || [];

// Em dia de prova, a tela do torneio e da prova se atualizam sozinhas a cada 2 minutos.
// Só busca quando a tela está visível, e não redesenha enquanto a pessoa digita na busca.
const AO_VIVO_MS = 2 * 60e3;
async function atualizarAoVivo() {
  if (document.visibilityState !== 'visible' || !S.dados) return;
  const t = S.torneio && achar(S.torneio);
  if (!t || !(S.tela === 'torneio' || S.tela === 'prova') || !emAndamento(t)) return;
  try {
    const [idx, dados, st] = await Promise.all([pegar(`${BASE}/index.json`), pegar(`${BASE}/t/${t.id}.json`), pegar(`${BASE}/stats.json`)]);
    const mudou = st.atualizadoEm !== S.stats?.atualizadoEm || JSON.stringify(dados) !== JSON.stringify(S.torneios[t.id]);
    S.dados = prepararDados(idx);
    S.torneios[t.id] = dados;
    S.stats = st;
    const digitando = document.activeElement && document.activeElement.tagName === 'INPUT';
    // com o vídeo da transmissão tocando, não redesenha para não interromper o vídeo
    const videoTocando = S.tela === 'torneio' && S.trTocando;
    if (mudou && !digitando && !videoTocando) { const y = window.scrollY; render(); window.scrollTo(0, y); }
  } catch {}
}
setInterval(atualizarAoVivo, AO_VIVO_MS);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') atualizarAoVivo(); });

        <li>Abra o Salta pelo ícone e ative os avisos</li>
      </ol>` : (semSuporte ? `<p>Este navegador não recebe avisos. Você pode seguir cavaleiros e cavalos do mesmo jeito e acompanhar tudo na aba Seguindo.</p>`
        : `<p>Os avisos chegam logo depois de cada resultado publicado, para quem você segue.</p>`)}
    </div>
    <div class="bv-pe">${pontos}${precisaInstalar || semSuporte ? `<button class="btn ouro" data-bv="fechar">Entendi</button>`
      : `<button class="btn ouro" data-bv="avisos">Ativar avisos</button><button class="bv-pular" data-bv="fechar">Agora não</button>`}</div></div>`;
}
function mostrarBoasVindas(passo = 0) {
  bvPasso = passo;
  let el = document.getElementById('boas-vindas');
  if (!el) { el = document.createElement('div'); el.id = 'boas-vindas'; document.body.appendChild(el); }
  el.innerHTML = telaBoasVindas();
  document.body.style.overflow = 'hidden';
  const foco = el.querySelector('[data-bv="proximo"],[data-bv="avisos"],[data-bv="fechar"]');
  if (foco) foco.focus();
}
function fecharBoasVindas() {
  try { localStorage.setItem(CHAVE_BV, '1'); } catch {}
  const el = document.getElementById('boas-vindas');
  if (el) el.remove();
  document.body.style.overflow = '';
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-bv]');
  if (!b) return;
  const acao = b.dataset.bv;
  if (acao === 'proximo') return mostrarBoasVindas(bvPasso + 1);
  if (acao === 'fechar') return fecharBoasVindas();
  if (acao === 'avisos') { fecharBoasVindas(); return ativarAvisos(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.getElementById('boas-vindas')) fecharBoasVindas(); });
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('link-fil')) { e.preventDefault(); e.stopPropagation(); e.target.click(); } });
function talvezBoasVindas() {
  let visto = false;
  try { visto = localStorage.getItem(CHAVE_BV) === '1'; } catch {}
  if (!visto) mostrarBoasVindas(0);
}

carregar().then(abrirPeloEndereco).then(talvezBoasVindas);
iniciarPush();
</script>
</body>
</html>
