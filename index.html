<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salta · Provas e resultados de salto</title>
<meta name="description" content="Calendário e resultados de provas de salto no Brasil, por Opportunity Leilões. Dados públicos da Federação Paulista de Hipismo.">
<meta property="og:title" content="Salta · Provas e resultados de salto">
<meta property="og:description" content="Calendário, resultados, ranking e perfis de cavaleiros e cavalos. Um projeto Opportunity Leilões.">
<meta property="og:type" content="website">
<meta property="og:image" content="./icon-512-v2.png">
<meta name="twitter:card" content="summary">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Salta">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#123D30">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192-v2.png">
<link rel="apple-touch-icon" href="./icon-192-v2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#123D30; --verde-2:#0A261E; --verde-3:#3B6656; --verde-linha:#2C5747;
  --ouro:#B8912F; --ouro-claro:#D9B45A; --ouro-escuro:#8A6A1F; --bronze:#A0643A;
  --bg:#F4F1EA; --surface:#FFFFFF; --ink:#1C231F; --ink-claro:#F4F1EA;
  --muted:#5C645F; --muted-2:#6E7670; --linha:#E2DDD0; --verde-claro:#C9D6CF;
  --ok:#1F7A4D; --vivo:#C0442F;
  --serif:"DM Serif Display",Georgia,"Times New Roman",serif;
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --verde:#0B2A21; --verde-2:#061A14; --verde-3:#2F5648; --verde-linha:#1E4034;
  --ouro:#D9B45A; --ouro-claro:#E7C87C; --ouro-escuro:#C9A345; --bronze:#C98452;
  --bg:#0E1512; --surface:#16211C; --ink:#E9EDE9; --ink-claro:#E9EDE9;
  --muted:#9AA79F; --muted-2:#8B978F; --linha:#25332C; --verde-claro:#B9C9C1;
  --ok:#5FBE8C; --vivo:#F08C79;
}}
:root[data-theme="dark"]{
  --verde:#0B2A21; --verde-2:#061A14; --verde-3:#2F5648; --verde-linha:#1E4034;
  --ouro:#D9B45A; --ouro-claro:#E7C87C; --ouro-escuro:#C9A345; --bronze:#C98452;
  --bg:#0E1512; --surface:#16211C; --ink:#E9EDE9; --ink-claro:#E9EDE9;
  --muted:#9AA79F; --muted-2:#8B978F; --linha:#25332C; --verde-claro:#B9C9C1;
  --ok:#5FBE8C; --vivo:#F08C79;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--verde);text-decoration:none}
:focus-visible{outline:2px solid var(--ouro);outline-offset:2px;border-radius:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:96px}
.serif{font-family:var(--serif);font-weight:400}

/* cabeçalhos */
.capa{background:var(--verde);color:var(--ink-claro);padding:18px 20px 20px;display:flex;flex-direction:column;gap:12px;position:relative;border-bottom:2px solid var(--ouro-escuro)}
/* filtros de categoria dentro do cabeçalho: rolam até a borda da tela */
.capa .chips{margin:2px -20px -2px;padding:2px 20px 4px;overflow-x:auto}
.capa h1+.sub{margin-top:-6px}
.capa h1{margin:0;font-family:var(--serif);font-weight:400;font-size:38px;line-height:1.02}
.capa h1.grande{font-size:36px;letter-spacing:.005em}
.capa .sub{font-size:13.5px;color:var(--verde-claro)}
.olho{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--ouro-claro)}
.topo-linha{display:flex;align-items:center;justify-content:space-between;gap:12px}
.marca{display:flex;align-items:baseline;gap:8px;font-family:var(--serif);font-size:22px}
.marca small{font-family:var(--sans);font-size:11.5px;font-weight:600;letter-spacing:.04em;opacity:.75}
.btn-fino{font-size:13px;font-weight:600;color:var(--ink-claro);border:1px solid var(--verde-3);border-radius:999px;padding:8px 14px;display:inline-flex;align-items:center;min-height:36px}
.voltar{min-height:44px;display:inline-flex;align-items:center;gap:6px;color:var(--ink-claro);font-size:14px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.numeros{display:flex;gap:22px;padding-top:12px;border-top:1px solid var(--verde-linha);flex-wrap:wrap}
.numeros div{display:flex;flex-direction:column}
.numeros b{font-family:var(--serif);font-weight:400;font-size:24px;color:var(--ouro-claro)}
.numeros span{font-size:12px;color:var(--verde-claro)}
.acoes{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1 1 140px;min-height:44px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:700;padding:0 12px;text-align:center}
.btn.ouro{background:var(--ouro-claro);color:#1C231F}
.btn.fantasma{border:1px solid var(--verde-3);color:var(--ink-claro);font-weight:600}
.btn.clara{border:1px solid var(--linha);background:var(--surface);color:var(--ink);font-weight:600}

/* filtros */
main{padding:0 0 8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 20px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--verde-3);background:transparent;color:var(--ink-claro);font-size:13.5px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ouro-claro);border-color:var(--ouro-claro);color:#1C231F;font-weight:700}
.chips.clara{padding:0}
.chips.clara .chip{border-color:var(--linha);color:var(--ink)}
.chips.clara .chip[aria-pressed="true"]{background:var(--verde);border-color:var(--verde);color:var(--ink-claro)}
.barra-filtros{display:flex;gap:8px;align-items:center;padding:16px 20px 0}
select{font:inherit;font-size:14px;min-height:40px;padding:0 10px;border-radius:4px;border:1px solid var(--linha);background:var(--surface);color:var(--ink);flex:1}
.secao{padding:18px 20px 8px;display:flex;align-items:baseline;gap:10px}
.secao h2{margin:0;font-family:var(--serif);font-weight:400;font-size:22px}
.secao .risco{flex-grow:1;height:1px;background:var(--linha)}
.secao .aux{font-size:12.5px;color:var(--muted)}

/* listas */
.lista{display:flex;flex-direction:column;gap:10px;padding:0 20px}
.cartao{display:flex;background:var(--surface);border:1px solid var(--linha);border-radius:4px;overflow:hidden;color:var(--ink);width:100%;text-align:left}
.cartao:hover{border-color:var(--ouro)}
.cartao .data{width:80px;flex:none;background:var(--verde);color:var(--ink-claro);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 6px;gap:2px}
.cartao .data.destaque{background:var(--ouro-escuro)}
/* "22–25" precisa caber numa linha só */
.cartao .data b{font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.05;white-space:nowrap;letter-spacing:-.01em}
.cartao .data b.longo{font-size:21px}
.cartao .data span{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-align:center;white-space:nowrap}
.cartao .corpo{flex-grow:1;min-width:0;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.cartao .nome{font-family:var(--serif);font-size:18px;line-height:1.15}
.cartao .meta{font-size:12.5px;color:var(--muted)}
.cartao .tag{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--ouro-escuro)}
.estrela{align-self:flex-start;width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--linha)}
.estrela[aria-pressed="true"]{color:var(--ouro)}
.vivo{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.1em;color:var(--vivo)}
.vivo i{width:8px;height:8px;border-radius:50%;background:var(--vivo);display:block}

/* dias */
.dias{display:flex;gap:16px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--linha);overflow-x:auto;scrollbar-width:none}
.dias::-webkit-scrollbar{display:none}
.dia{flex:none;min-height:58px;padding:0 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--muted-2);font-size:11px;font-weight:700;letter-spacing:.08em}
.dia b{font-family:var(--serif);font-weight:400;font-size:22px;line-height:1}
.dia[aria-pressed="true"]{color:var(--ink);box-shadow:inset 0 -3px 0 var(--ouro)}

/* provas */
.prova{display:flex;align-items:center;gap:14px;padding:14px;background:var(--surface);border:1px solid var(--linha);border-radius:4px;width:100%;text-align:left;color:var(--ink)}
.prova.destaque{border-color:var(--ouro)}
.prova .alt{width:62px;flex:none;display:flex;flex-direction:column}
.prova .alt b{font-family:var(--serif);font-weight:400;font-size:26px;line-height:1}
.prova .alt span{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.prova .corpo{flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.prova .venc{font-size:14.5px;font-weight:600}
.seta{flex:none;color:var(--muted-2)}

/* resultado */
.podio{display:flex;flex-direction:column;padding:0 20px}
.linha-podio{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--linha);width:100%;text-align:left;color:var(--ink)}
.linha-podio .nome{font-family:var(--serif);font-size:19px;line-height:1.1}
.linha-podio .meta{font-size:12.5px;color:var(--muted)}
.linha-podio .res{flex:none;text-align:right;display:flex;flex-direction:column}
.linha-podio .res b{font-size:15px;font-weight:700}
.linha-podio .res span{font-size:11.5px;color:var(--muted)}
.tabela{display:flex;flex-direction:column;padding:0 20px}
.cab{display:flex;padding:10px 0 6px;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.cab .p{width:40px}.cab .c{flex-grow:1}.cab .f{width:52px;text-align:right}.cab .t{width:66px;text-align:right}
.linha{display:flex;align-items:center;padding:10px 0;border-top:1px solid var(--linha);width:100%;text-align:left;color:var(--ink)}
.linha .pos{width:40px;flex:none;text-align:center;font-family:var(--serif);font-size:20px;color:var(--muted)}
.linha .conj{flex-grow:1;min-width:0;display:flex;flex-direction:column}
.linha .cav{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linha .cavalo{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linha .f{width:52px;flex:none;text-align:right;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.linha .f.zero{color:var(--ok)}
.linha .t{width:66px;flex:none;text-align:right;font-size:14.5px;font-variant-numeric:tabular-nums}
.status{font-size:12px;font-weight:600;color:var(--muted)}
.busca{width:100%;font:inherit;font-size:15px;min-height:44px;padding:0 12px;border:1px solid var(--linha);border-radius:4px;background:var(--surface);color:var(--ink)}

/* perfis e ranking */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:16px 20px 0}
.stats div{background:var(--surface);border:1px solid var(--linha);border-radius:4px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.stats b{font-family:var(--serif);font-weight:400;font-size:24px;line-height:1}
.stats span{font-size:11px;color:var(--muted);text-align:center}
.carrossel{display:flex;gap:8px;padding:0 20px;overflow-x:auto;scrollbar-width:none}
.carrossel::-webkit-scrollbar{display:display}
.carrossel::-webkit-scrollbar{display:none}
.mini{flex:none;width:150px;background:var(--surface);border:1px solid var(--linha);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:4px;color:var(--ink);text-align:left}
.mini b{font-family:var(--serif);font-weight:400;font-size:16px;line-height:1.15}
.mini span{font-size:12px;color:var(--muted)}
.painel{margin:16px 20px 0;background:var(--surface);border:1px solid var(--linha);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:12px}
.painel h3{margin:0;font-family:var(--serif);font-weight:400;font-size:20px}
.barra{display:flex;align-items:center;gap:10px}
.barra .rot{width:52px;flex:none;font-family:var(--serif);font-size:16px}
.barra .trilho{flex-grow:1;height:18px;border-radius:2px;background:var(--bg);display:flex;overflow:hidden}
.barra .trilho i{display:block;height:100%}
.barra .trilho .v{background:var(--ouro)}
.barra .trilho .o{background:var(--verde-3)}
.barra .num{width:42px;flex:none;text-align:right;font-size:13px}
.legenda{display:flex;gap:14px;font-size:11.5px;color:var(--muted)}
.legenda span{display:flex;align-items:center;gap:6px}
.legenda i{width:10px;height:10px;border-radius:2px;display:block}

/* seguindo */
.seguidos{display:flex;gap:14px;padding:0 20px;overflow-x:auto;scrollbar-width:none}
.seguidos::-webkit-scrollbar{display:none}
.seguido{flex:none;width:76px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink)}
.seguido .bolha{width:58px;height:58px;border-radius:50%;background:var(--verde);color:var(--ouro-claro);border:2px solid var(--ouro);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:20px}
.seguido span{font-size:11.5px;font-weight:600;text-align:center;line-height:1.2}
.feed{display:flex;flex-direction:column;gap:10px;padding:0 20px}
.novidade{background:var(--surface);border:1px solid var(--linha);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;color:var(--ink)}
.novidade .topo{display:flex;align-items:center;justify-content:space-between;gap:10px}
.novidade .tag{font-size:11px;font-weight:700;letter-spacing:.14em}
.novidade .txt{font-family:var(--serif);font-size:17px;line-height:1.25}
.novidade .onde{font-size:12.5px;color:var(--muted)}
.opcoes{margin:0 20px;background:var(--surface);border:1px solid var(--linha);border-radius:4px;display:flex;flex-direction:column}
.opcao{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--linha);width:100%;text-align:left;color:var(--ink);min-height:52px}
.opcao:last-child{border-bottom:0}
.opcao span{flex-grow:1;font-size:14px}
.switch{width:44px;height:26px;flex:none;border-radius:999px;background:var(--linha);position:relative;display:block;transition:background .15s}
.switch i{position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;display:block;transition:left .15s}
.opcao[aria-pressed="true"] .switch{background:var(--verde)}
.opcao[aria-pressed="true"] .switch i{left:21px}

/* estados */
.vazio{text-align:center;padding:40px 24px;color:var(--muted);font-size:14.5px;line-height:1.6}
.vazio b{display:block;font-family:var(--serif);font-weight:400;font-size:22px;color:var(--ink);margin-bottom:6px}
.fonte{font-size:12px;color:var(--muted);line-height:1.5;padding:16px 20px 0}
.fonte a{font-weight:700;text-decoration:underline}
.aviso{margin:14px 20px 0;padding:12px 14px;border:1px solid var(--linha);background:var(--surface);border-radius:4px;font-size:13.5px;color:var(--muted)}


/* destaque editorial: leilão ou aviso ligado a um torneio */
.selo-dest{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;margin-top:6px;font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--ouro-escuro);background:var(--bg);border:1px solid var(--ouro);border-radius:999px;padding:4px 10px}
.destaque-aviso{margin:16px 20px 0;background:var(--surface);border:1px solid var(--ouro);border-left:4px solid var(--ouro);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:6px}
.destaque-aviso .chapeu{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ouro-escuro)}
.destaque-aviso .tit{font-family:var(--serif);font-size:21px;line-height:1.15}
.destaque-aviso .quando{font-size:13.5px;font-weight:600;color:var(--verde)}
.destaque-aviso .txt{font-size:13.5px;line-height:1.5;color:var(--muted)}
.destaque-aviso .btn{margin-top:6px;align-self:flex-start;flex:none;min-width:200px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .destaque-aviso .quando{color:var(--ouro-claro)}}
:root[data-theme="dark"] .destaque-aviso .quando{color:var(--ouro-claro)}

/* selo dos cavalos vendidos pela Opportunity */
.selo-opp{display:inline-flex;align-items:center;margin-left:6px;padding:0 5px;border:1px solid var(--ouro);border-radius:3px;font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.05em;line-height:15px;color:var(--ouro-escuro);vertical-align:1px;white-space:nowrap}
.venda-opp{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;margin-top:2px;padding:6px 10px;border:1px solid var(--ouro);border-radius:4px;font-size:12.5px;font-weight:600;color:inherit}
/* aba Opportunity: um cartão por prova com os cavalos vendidos que saltaram nela */
.cartao-opp{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--linha);border-radius:4px;padding:14px 40px 12px 16px;position:relative;cursor:pointer}
.cartao-opp:hover{border-color:var(--ouro)}
.cartao-opp>svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted-2)}
.topo-opp{font-size:12px;letter-spacing:.04em;color:var(--ouro-escuro);font-weight:600}
.topo-opp b{font-weight:700}
.torneio-opp{font-family:var(--serif);font-size:17px;line-height:1.2}
.linha-opp{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:8px;border-top:1px solid var(--linha)}
.cav-opp{display:flex;flex-direction:column;min-width:0}
.cav-opp b{font-size:14px;font-weight:600}
.cav-opp span{font-size:12.5px;color:var(--muted)}
.res-opp{flex:none;font-size:13px;color:var(--muted);text-align:right}
.res-opp b{font-size:15px}
/* transmissão HorsePix */
.transmissao{margin:16px 20px 0;display:flex;flex-direction:column;gap:10px}
.tr-olho{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;letter-spacing:.12em;color:var(--ouro-escuro)}
.tr-olho i{width:8px;height:8px;border-radius:50%;background:var(--vivo);display:block}
.tr-player{position:relative;aspect-ratio:16/9;background:#0A0F0D;border-radius:4px;overflow:hidden;border:1px solid var(--linha)}
.tr-player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.tr-capa{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;background:#0A0F0D;cursor:pointer}
.tr-capa img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85}
.tr-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:var(--ouro);color:#1C231F;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.tr-play svg{margin-left:4px}
.tr-dias{padding:0}
.tr-yt{align-self:flex-end;font-size:12.5px;font-weight:600;color:var(--muted)}

.sub.atualizado{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;opacity:.85}

/* boas-vindas */

.bv{width:100%;max-width:520px;height:100%;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 40px) 26px calc(env(safe-area-inset-bottom,0px) + 28px);overflow-y:auto}

.bv-corpo{display:flex;flex-direction:column;gap:16px}
.bv-centro{align-items:center;text-align:center;padding-top:8vh}
.bv h2{font-family:var(--serif);font-weight:400;font-size:clamp(28px,7vw,36px);line-height:1.12;margin:6px 0 0}

.bv-marca{display:flex;align-items:baseline;gap:10px}
.bv-marca b{font-family:var(--serif);font-weight:400;font-size:48px;line-height:1}
.bv-marca small{font-size:13px;font-weight:600;color:#C9D6CF}
.bv-pe{display:flex;flex-direction:column;gap:12px;margin-top:28px}

.bv-pontos{display:flex;justify-content:center;gap:6px;margin-bottom:6px}

.bv-verde .bv-pontos i{background:#3E6558}.bv-verde .bv-pontos i.on{background:var(--ouro)}
.bv-ilustra{background:var(--verde);border-radius:6px;padding:20px 16px;display:flex;flex-direction:column;gap:10px}
.bv-olho{font-size:11.5px;font-weight:700;letter-spacing:.14em;color:var(--ouro)}
.bv-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);color:var(--ink);border:1px solid var(--linha);border-radius:4px;padding:11px 13px;color:var(--muted-2)}

.bv-item small{font-size:12.5px;color:var(--muted)}
.bv-item.on{border-color:var(--ouro);color:var(--ouro)}
.bv-item.on svg{fill:var(--ouro)}
.bv-aviso{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--linha);border-radius:16px;padding:12px 14px;box-shadow:0 10px 26px rgba(18,61,48,.16)}
.bv-aviso>svg{flex:none;background:var(--verde);border-radius:9px;padding:4px}
.bv-aviso span{display:flex;flex-direction:column;gap:2px}
.bv-aviso b{font-size:14px}
.bv-aviso small{font-size:13.5px;color:var(--muted);line-height:1.4}
.bv-passos{margin:4px 0 0;padding:16px 16px 16px 40px;background:var(--surface);border:1px solid var(--linha);border-radius:6px;display:flex;flex-direction:column;gap:10px;font-size:15px}
.bv-ic{display:inline-flex;vertical-align:-3px;color:#2F6FED;margin-left:2px}
.sub.ficha{font-size:13.5px;opacity:.9}
@media (prefers-reduced-motion:reduce){.bv-pontos i{transition:none}}
.filiacao{display:block;font-size:12px;line-height:1.35;color:var(--muted);margin-top:1px;font-style:italic}
.selo-fonte{display:inline-flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--muted);border:1px solid var(--linha);border-radius:3px;padding:1px 6px;margin-right:6px;white-space:nowrap}
.nota-fonte{display:block}
.resumo-torneio{margin:16px 20px 0;background:var(--surface);border:1px solid var(--linha);border-radius:4px;padding:4px 16px 14px}
.resumo-torneio p{margin:0 0 10px;font-size:15px;line-height:1.6}
.link-ficha{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;text-decoration-color:var(--ouro);text-underline-offset:3px;cursor:pointer}
.painel.convite h3{margin:0;font-family:var(--serif);font-weight:400;font-size:21px}
.painel.convite p{margin:0;font-size:14.5px;color:var(--muted)}
.painel.convite .btn{align-self:flex-start;flex:none;height:auto;min-height:44px;padding:10px 18px}
.prosa-haras{margin:16px 20px 0;font-size:15px;line-height:1.6}
.capa .chips{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;flex-wrap:nowrap}
.capa .chips::-webkit-scrollbar{display:none}
.capa .chips .chip{flex:none}
.capa .chips.rola{-webkit-mask-image:linear-gradient(90deg,#000 82%,transparent);mask-image:linear-gradient(90deg,#000 82%,transparent)}
.capa .chips.rola.no-fim{-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%);mask-image:linear-gradient(90deg,transparent,#000 14%)}
.selo-wbfsh{display:inline-flex;align-items:center;margin-left:6px;padding:0 6px;border:1px solid var(--verde);border-radius:3px;font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.04em;line-height:15px;color:var(--verde);vertical-align:1px;white-space:nowrap}
.link-fil{cursor:pointer;text-decoration:underline;text-decoration-color:rgba(217,180,90,.7);text-underline-offset:2px}
.link-fil:hover{color:var(--ink)}
.dest{color:var(--ouro-escuro);font-weight:600}
.reguas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 20px 0}
.regua{background:var(--surface);border:1px solid var(--linha);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:4px}
.regua b{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1}
.regua span{font-size:12.5px;color:var(--muted);line-height:1.4}
.regua a{font-size:12px;font-weight:600;color:var(--verde)}
.olho-r{font-size:10.5px!important;font-weight:700;letter-spacing:.14em;color:var(--ouro-escuro)!important}
.familia{display:flex;flex-direction:column;gap:8px;padding:0 20px}
.fam{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--linha);border-radius:4px;padding:12px 14px;font:inherit;color:var(--ink);cursor:pointer;position:relative}
.fam:hover{border-color:var(--ouro)}
.fam b{font-family:var(--serif);font-weight:400;font-size:18px}
.fam span{font-size:12.5px;color:var(--muted)}
.fam .selo-wbfsh{position:absolute;right:12px;top:12px;margin:0}
.bloco-geral .secao{align-items:center}
.secao .aux.link-ficha{font-size:13px;font-weight:600;color:var(--ouro-escuro);white-space:nowrap}
.metodo{margin:18px 20px 0}
.metodo h2{font-family:var(--serif);font-weight:400;font-size:22px;margin:0 0 6px}
.metodo p{margin:0 0 10px;font-size:15px;line-height:1.6}
@media (min-width:760px){.familia{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:0 28px}.reguas{margin:16px 28px 0}.metodo{margin-left:28px;margin-right:28px;max-width:760px}}
@media (min-width:1100px){.familia{padding:0 36px;max-width:880px}.reguas{margin:16px 36px 0;max-width:808px}.metodo{margin-left:36px}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .selo-wbfsh{color:#7FC4A4;border-color:#3E6558}:root:not([data-theme="light"]) .regua a{color:#7FC4A4}}

/* navegação */
nav.abas{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--linha);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.abas .inner{max-width:560px;margin:0 auto;display:flex}
nav.abas button{flex:1;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted-2);font-size:11.5px;font-weight:600}
nav.abas button b{width:18px;height:3px;border-radius:2px;background:transparent;display:block}
nav.abas button[aria-current="page"]{color:var(--verde);font-weight:700}
nav.abas button[aria-current="page"] b{background:var(--ouro)}
/* com cinco abas, textos um pouco menores para caber em telas estreitas */
nav.abas.cinco button{font-size:10.5px;letter-spacing:-.01em}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav.abas button[aria-current="page"]{color:var(--ouro-claro)}}
:root[data-theme="dark"] nav.abas button[aria-current="page"]{color:var(--ouro-claro)}

/* card de compartilhar */
.folha{position:fixed;inset:0;background:rgba(10,20,16,.6);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding:16px}
.folha .caixa{width:100%;max-width:420px;background:var(--bg);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto}
.folha h3{margin:0;font-family:var(--serif);font-weight:400;font-size:22px}
#cartaoArea{width:100%;aspect-ratio:9/16;border-radius:6px;overflow:hidden;background:var(--verde)}
#cartaoArea svg{width:100%;height:100%;display:block}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .18s ease-out}@keyframes f{from{opacity:0;transform:translateY(4px)}to{opacity:1}}}

/* ===================== responsivo: tablet e computador =====================
   O celular continua igual. A partir de 760px a coluna se alarga e as listas viram grade;
   a partir de 1100px a barra de baixo vira um menu lateral fixo à esquerda. */
@media (min-width:760px){
  .app{max-width:900px}
  nav.abas .inner{max-width:900px}
  .lista{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .lista>*{min-width:0}
  .cartao{height:100%}
  .capa{padding:24px 28px 26px}
  .capa h1{font-size:44px}
  .lista,.barra-filtros,.chips.clara,.secao{padding-left:28px;padding-right:28px}
  .cartao:hover,.cartao-opp:hover,button.prova:hover{border-color:var(--ouro)}
  .chips.clara{padding-left:28px!important;padding-right:28px!important}
  .capa .acoes{max-width:440px}
}
@media (min-width:1100px){
  :root{--lateral:236px}
  body{padding-left:var(--lateral)}
  .app{max-width:1180px;padding-bottom:48px}
  /* menu lateral */
  nav.abas{top:0;right:auto;bottom:0;width:var(--lateral);border-top:0;border-right:1px solid var(--linha);padding:28px 14px calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;flex-direction:column}
  nav.abas::before{content:'Salta';order:-2;display:block;font-family:var(--serif);font-size:30px;line-height:1;color:var(--ink);padding:0 12px 6px}
  nav.abas::after{content:'by Opportunity';display:block;order:-1;font-size:12px;font-weight:600;color:var(--muted);padding:0 12px 26px;margin-top:-2px}
  nav.abas .inner{max-width:none;margin:0;flex-direction:column;gap:4px}
  nav.abas button,nav.abas.cinco button{flex:none;min-height:48px;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 14px;border-radius:6px;font-size:15px;letter-spacing:0;position:relative}
  nav.abas button b{position:absolute;left:0;top:12px;bottom:12px;width:3px;height:auto;border-radius:2px}
  nav.abas button:hover{background:rgba(127,127,127,.08)}
  nav.abas button[aria-current="page"]{background:rgba(217,180,90,.14)}
  /* grade de cartões mais larga */
  .lista{grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
  .capa{padding:30px 36px 32px}
  .capa h1{font-size:52px}
  .lista,.barra-filtros,.chips.clara,.secao{padding-left:36px;padding-right:36px}
  /* tabelas e textos longos não precisam ocupar a tela inteira */
  .tabela,.podio{max-width:880px;padding-left:36px;padding-right:36px}
  .fonte{max-width:880px;padding-left:36px;padding-right:36px}
  .painel,.destaque-aviso,.transmissao,.resumo-torneio{max-width:808px;margin-left:36px;margin-right:36px}
  .chips.clara{padding-left:36px!important;padding-right:36px!important}
  /* a marca já está no menu lateral */
  .capa .topo-linha .marca{visibility:hidden}
}

/* ===================== novo visual do app ===================== */
.avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-family:var(--serif);flex:none;line-height:1;letter-spacing:.01em}
.redondo{width:42px;height:42px;border-radius:50%;background:var(--surface);border:1px solid var(--linha);display:inline-flex;align-items:center;justify-content:center;color:var(--ink);padding:0}

/* barra de navegação em pílula flutuante (celular e tablet) */
@media (max-width:1099px){
  .app{padding-bottom:124px}
  nav.abas{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-bottom:0;border:1px solid var(--linha);border-radius:36px;background:var(--surface);background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 10px 30px rgba(18,61,48,.16)}
  nav.abas .inner{max-width:none;padding:0 4px}
  nav.abas button{min-height:68px;gap:2px}
  nav.abas button b{display:none}
  nav.abas .aba-ic{width:48px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;transition:background .2s}
  nav.abas button[aria-current="page"] .aba-ic{background:rgba(217,180,90,.28)}
  .toast{bottom:100px}
}
@media (prefers-reduced-motion:reduce){nav.abas .aba-ic{transition:none}}

/* aba Hoje */

.selo-vivo{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.12em;color:#FF8A7F;flex:none}

.ao-vivo-acao{display:flex;align-items:center;gap:10px;width:calc(100% - 28px);margin:0 14px;padding:10px 12px;border:0;border-radius:18px;background:rgba(255,255,255,.09);color:inherit;font:inherit;text-align:left;cursor:pointer}
.ao-vivo-acao>span:first-child{flex:1;display:flex;flex-direction:column;min-width:0}

.btn-vivo{height:38px;padding:0 14px;border-radius:19px;background:#D9B45A;color:#1C231F;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;flex:none}

/* arco da trajetória */
.arco{position:relative;margin:0 auto;max-width:100%}
.arco svg{display:block;max-width:100%}
.arco-resto{stroke:rgba(255,255,255,.55)}
.arco-feito{stroke:#D9B45A}
.arco-vara{fill:#D9B45A}
.arco-poste{fill:#F4F1EA;opacity:.75}
.arco-cavalo{position:absolute}
.arco-cavalo .avatar{box-shadow:0 0 0 3px #D9B45A,0 6px 16px rgba(0,0,0,.35)}
.arco-num{position:absolute;left:0;right:0;text-align:center;color:#F4F1EA;display:flex;flex-direction:column;align-items:center}

.arco-prox{font-size:13px;color:#C9D6CF;text-align:center}
.arco-prox b{color:#F4F1EA}

/* arena: com a prova ao vivo, a tela inteira escurece */
body[data-arena]{--bg:#0E1512;--surface:#16211C;--ink:#E9EDE9;--muted:#9AA79F;--muted-2:#8B978F;--linha:#25332C;--verde:#0B2A21;--ouro-escuro:#D9B45A;--ok:#5FBE8C;background:#0E1512}
body[data-arena] .capa{background:radial-gradient(120% 90% at 70% 0%,#1F4D3E 0%,#0B2A21 55%,#0E1512 100%)}
body[data-arena] .chips.clara .chip[aria-pressed="true"]{background:#D9B45A;border-color:#D9B45A;color:#1C231F}
@media (max-width:1099px){body[data-arena] nav.abas{background:rgba(22,33,28,.94);border-color:#25332C;box-shadow:0 10px 30px rgba(0,0,0,.4)}body[data-arena] nav.abas button[aria-current="page"]{color:#D9B45A}}

/* campeão em tela cheia */
#campeao{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;color:#fff;background:linear-gradient(170deg,#1E4E3E 0%,#123D30 45%,#08110E 100%);padding:calc(env(safe-area-inset-top,0px) + 16px) 20px calc(env(safe-area-inset-bottom,0px) + 24px);overflow-y:auto}
.campeao-arco{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.campeao-topo{position:relative;display:flex;align-items:center;gap:10px}

async function pegar(url) {
  const r = await fetch(url, { cache: 'no-cache' });
  if (!r.ok) throw new Error(r.status === 404 ? 'sem-dados' : 'HTTP ' + r.status);
  return r.json();
}
function prepararDados(d) {
  d.torneios.forEach(t => {
    t.cat = categoria(t.modalidade);
    t.todasProvas = t.provas;
    t.provas = t.todasProvas.filter(p => provaAconteceOuVaiAcontecer(t, p));
    t.ocultas = t.todasProvas.length - t.provas.length;
    t.alturas = [...new Set(t.provas.map(p => p.altura).filter(h => h != null))].sort((a, b) => a - b);
    t.temRes = t.provas.some(p => p.res);
    t.dias = [...new Set(t.provas.map(p => p.dia).filter(Boolean))].sort();
  });
  return d;
}

  try { S.stats = await pegar(`${BASE}/stats.json`); render(); } catch {}
  // destaques são escritos à mão em data/hipica/destaques.json e o coletor não mexe neles
  try { S.destaques = await pegar(`${BASE}/destaques.json`); render(); } catch {}

}

function base64ParaBytes(b) {
  const s = atob((b + '='.repeat((4 - b.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(s, c => c.charCodeAt(0));
}
async function iniciarPush() {
  const suportado = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  if (!suportado) { push.estado = ehIOS && !naTelaDeInicio() ? 'ios-instalar' : 'sem-suporte'; return render(); }
  try {
    push.reg = await navigator.serviceWorker.register('./sw.js');
    push.sub = await push.reg.pushManager.getSubscription();
  } catch { push.estado = 'sem-suporte'; return render(); }
  push.estado = Notification.permission === 'denied' ? 'bloqueado' : (push.sub ? 'ativo' : 'inativo');
  render();
  if (push.sub) salvarInscricao().catch(() => {}); // mantém o servidor em dia com o que a pessoa segue
}
async function rpc(nome, corpo) {
  const r = await fetch(`${PUSH.url}/rest/v1/rpc/${nome}`, {
    method: 'POST',
    headers: { apikey: PUSH.chave, 'Content-Type': 'application/json' },
    body: JSON.stringify(corpo),
  });
  if (!r.ok) throw new Error('Servidor respondeu ' + r.status);
}

  if (!push.sub) return Promise.resolve();
  const j = push.sub.toJSON();
  return rpc('salvar_inscricao', {
    p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth,
    p_seguindo: seguindo.map(x => ({ tipo: x.tipo, k: x.k, nome: x.nome })),
    p_torneios: salvos,
    p_avisos: avisos,
    p_plataforma: ehIOS ? 'ios' : (/android/i.test(navigator.userAgent) ? 'android' : 'computador'),

}

function sincronizarAvisos() {

}
async function ativarAvisos() {
  if (push.ocupado) return;
  push.ocupado = true; push.erro = null; render();
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { push.estado = perm === 'denied' ? 'bloqueado' : 'inativo'; return; }
    push.sub = await push.reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: base64ParaBytes(PUSH.vapid) });
    await salvarInscricao();
    push.estado = 'ativo';
    push.reg.showNotification('Avisos ativados', { body: 'Você vai saber quando quem você segue subir no pódio.', icon: './icon-192.png' });
  } catch (e) {
    push.erro = 'Não deu para ativar agora. Verifique a conexão e tente de novo.';
  } finally { push.ocupado = false; render(); }
}
async function desativarAvisos() {
  if (push.ocupado || !push.sub) return;
  push.ocupado = true; render();

    await rpc('remover_inscricao', { p_endpoint: push.sub.endpoint }).catch(() => {});

}

  const com = t.provas.filter(p => p.res && p.v);
  if (!com.length) return null;
  return com.find(p => p.gp) || com.reduce((a, b) => (b.altura ?? 0) >= (a.altura ?? 0) ? b : a);
}

function cartaoTorneio(t, comVencedor) {
  const p = periodo(t), destaque = emAndamento(t);
  const venc = comVencedor ? provaDestaque(t) : null;
  return `<button class="cartao" data-torneio="${t.id}">
    <span class="data${destaque ? ' destaque' : ''}"><b class="${p.cima.length > 4 ? 'longo' : ''}">${p.cima}</b><span>${p.baixo}</span></span>
    <span class="corpo">
      ${destaque ? '<span class="vivo"><i></i>ACONTECENDO AGORA</span>' : ''}
      <span class="nome">${esc(titulo(t.nome))}</span>
      <span class="meta">${esc(titulo(t.local || 'Local a confirmar'))}</span>
      <span class="tag">${t.cat.toUpperCase()}${t.alturas.length ? ' · ' + fmtAlt(t.alturas[0]) + (t.alturas.length > 1 ? ' a ' + fmtAlt(t.alturas[t.alturas.length - 1]) : '') : ''}${venc ? '' : (t.provas.length ? ` · ${t.provas.length} PROVAS` : ' · PROGRAMAÇÃO EM BREVE')}</span>
      ${venc ? `<span class="meta">Venceu a ${fmtAlt(venc.altura)}: <strong>${esc(titulo(venc.v.c))}</strong> com ${esc(titulo(venc.v.h))}</span>` : ''}
      ${aoVivoHoje(t) ? `<span class="selo-tr"><i></i>Transmissão ao vivo</span>` : ''}
      ${destaqueDe(t) ? `<span class="selo-dest">${esc(destaqueDe(t).selo || 'Leilão durante o torneio')}</span>` : ''}
    </span>
    <span class="estrela" role="img" aria-hidden="true" ${salvos.includes(t.id) ? 'aria-pressed="true"' : ''}>${estrelaSvg}</span>
  </button>`;
}

const FAIXAS = { todas: () => true, baixa: h => h <= 1.00, media: h => h >= 1.05 && h <= 1.30, alta: h => h >= 1.35 };
function chipsCategoria(base) {
  const cats = ['Todas', ...[...new Set(base.map(t => t.cat))].sort()];
  if (cats.length < 3) return '';
  return `<div class="chips" role="group" aria-label="Categoria">
      ${cats.map(c => `<button class="chip" data-cat="${esc(c)}" aria-pressed="${S.cat === c}">${esc(c)}</button>`).join('')}
    </div>`;
}
function filtros() {
  return `<div class="barra-filtros">
      <label class="sr" for="altura">Altura</label>
      <select id="altura">
        <option value="todas">Todas as alturas</option>
        <option value="baixa">Até 1,00m</option>
        <option value="media">1,05m a 1,30m</option>
        <option value="alta">1,35m ou mais</option>
      </select>
      <button class="btn clara" style="flex:none" data-acao="salvos" aria-pressed="${S.soSalvos}">★ Salvos</button>
    </div>`;
}
const aplicar = lista => lista.filter(t => (S.cat === 'Todas' || t.cat === S.cat)
  && (S.altura === 'todas' || t.alturas.some(FAIXAS[S.altura]))
  && (!S.soSalvos || salvos.includes(t.id)));
const semFiltro = `<div class="vazio"><b>Nada com esses filtros</b><button class="btn clara" style="margin-top:12px;flex:none" data-acao="limpar">Limpar filtros</button></div>`;

function rodape(extra) {
  const at = S.dados?.atualizadoEm ? new Date(S.dados.atualizadoEm) : null;
  const quando = at ? `${pad(at.getDate())}/${pad(at.getMonth() + 1)} às ${pad(at.getHours())}:${pad(at.getMinutes())}` : '–';
  return `<p class="fonte">${extra || ''}Dados públicos da Federação Paulista de Hipismo, atualizados em ${quando}.</p>`;
}

// ---------- telas ----------
// ---------- linguagem do app: avatares e o arco da trajetória do salto ----------
const PALETAS = [['#2E6B55', '#123D30'], ['#9A6A3C', '#5E3B1C'], ['#C9A34A', '#8A6A1F'], ['#6B7570', '#3A423E'], ['#C97B3C', '#8A4A1C']];
function iniciaisAv(nome) {
  const p = String(nome || '').replace(/\([^)]*\)/g, ' ').split(/\s+/).filter(w => /[A-Za-zÀ-ÿ]/.test(w) && !PEQ.has(w.toLowerCase()));
  return ((p[0] || '?')[0] + ((p[1] || '')[0] || '')).toUpperCase();
}
function avatar(nome, t = 48) {
  let h = 0; for (const c of chave(nome)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const [a, b] = PALETAS[h % PALETAS.length];
  return `<span class="avatar" style="width:${t}px;height:${t}px;font-size:${Math.round(t * 0.38)}px;background:linear-gradient(140deg,${a},${b})" aria-hidden="true">${esc(iniciaisAv(nome))}</span>`;
}
// progresso da prova desenhado como a trajetória do salto: o feito em dourado, o resto pontilhado, o cavalo da vez no ponto do arco
function arcoTrajetoria(feito, total, nome, { larg = 320, alt = 100, rotulo = 'conjuntos já saltaram' } = {}) {
  const cx = larg / 2, base = alt + 8, rx = larg / 2 - 14, ry = alt - 10, n = 60;
  const pt = t => { const a = Math.PI * (1 - t); return [cx + rx * Math.cos(a), base - ry * Math.sin(a)]; };
  const fr = total ? Math.min(1, feito / total) : 0, k = Math.round(n * fr);
  const pts = Array.from({ length: n + 1 }, (_, i) => pt(i / n));
  const d = arr => 'M' + arr.map(([x, y]) => `${x.toFixed(1)} ${y.toFixed(1)}`).join(' L');
  const [px, py] = pt(fr);
  return `<div class="arco" style="width:${larg}px;height:${alt + 40}px" role="img" aria-label="${feito} de ${total} ${rotulo}">
    <svg width="${larg}" height="${alt + 40}" viewBox="0 0 ${larg} ${alt + 40}" fill="none" aria-hidden="true">
      ${k < n ? `<path d="${d(pts.slice(k))}" class="arco-resto" stroke-width="3.6" stroke-linecap="round" stroke-dasharray="0.1 8"/>` : ''}
      ${k > 0 ? `<path d="${d(pts.slice(0, k + 1))}" class="arco-feito" stroke-width="4" stroke-linecap="round"/>` : ''}
      <rect x="${cx - 34}" y="${base - 2}" width="68" height="5" rx="2.5" class="arco-vara"/>
      <rect x="${cx - 38}" y="${base - 12}" width="6" height="30" rx="3" class="arco-poste"/><rect x="${cx + 32}" y="${base - 12}" width="6" height="30" rx="3" class="arco-poste"/>
    </svg>
    ${nome ? `<span class="arco-cavalo" style="left:${(px - 19).toFixed(0)}px;top:${(py - 19).toFixed(0)}px">${avatar(nome, 38)}</span>` : ''}
    <span class="arco-num" style="top:${Math.round(alt * 0.4)}px"><b>${feito}<small> / ${total}</small></b><span>${rotulo}</span></span>
  </div>`;
}
const minutosDe = hora => { const m = String(hora || '').match(/(\d{1,2})[:h](\d{2})/); return m ? +m[1] * 60 + +m[2] : null; };
const minutosAgora = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
// começou e ainda está dentro de uma janela de quatro horas; sem horário, conta como em andamento no dia
const comecouHaPouco = (p, agora = minutosAgora()) => { const ini = minutosDe(p.hora); return ini == null || (agora >= ini && agora - ini <= 240); };
// a prova que está acontecendo agora: de hoje, já começada, com parte dos conjuntos ainda por saltar
function provaAoVivo() {
  const hoje = hojeISO(), agora = minutosAgora();
  const cands = [];
  for (const t of S.dados.torneios.filter(emAndamento))
    for (const p of t.provas || [])
      if (p.dia === hoje && p.oe && (p.n || 0) > 0 && p.oe - (p.n || 0) >= 2 && comecouHaPouco(p, agora)) cands.push({ t, p });
  cands.sort((a, b) => (minutosDe(b.p.hora) ?? 0) - (minutosDe(a.p.hora) ?? 0));
  return cands[0] || null;
}
function proximoNaOrdem(tId, p) {
  const dados = S.torneios[tId];
  if (!dados) { carregarTorneio(tId); return null; }
  if (typeof dados !== 'object') return null;
  const ordem = ((dados.ordem || {})[String(p.id)] || []).slice().sort((a, b) => a.o - b.o);
  const feitos = new Set(((dados.provas || {})[String(p.id)] || []).map(l => chave(l.h)));
  return ordem.find(o => !feitos.has(chave(o.h))) || null;
}
// ---------- aba Hoje: seguidos, a prova ao vivo e os momentos do dia ----------
function blocoHoje() {
  let html = '';
  // seguidos, como stories
  const seg = seguindo.slice(0, 12);
  html += `<div class="stories" role="list">${seg.map(x => `<button class="story" role="listitem" data-perfil="${x.tipo}" data-k="${esc(x.k)}"><span class="story-anel">${avatar(x.nome || x.k, 54)}</span><span>${esc(titulo(x.nome || x.k))}</span></button>`).join('')}
    <button class="story" role="listitem" data-aba="seguindo"><span class="story-anel vazio">${svg('<path d="M12 5v14M5 12h14"/>', 22)}</span><span>${seg.length ? 'Seguir mais' : 'Seguir'}</span></button></div>`;
  // a prova ao vivo, com o arco
  const vivo = provaAoVivo();
  if (vivo) {
    const { t, p } = vivo;
    const prox = proximoNaOrdem(t.id, p);
    const feito = Math.min(p.n || 0, p.oe);
    html += `<section class="ao-vivo">
      <div class="ao-vivo-topo"><span class="selo-vivo"><i></i>AO VIVO</span><span>${esc(titulo(t.nome))} · ${fmtAlt(p.altura)}</span></div>
      ${arcoTrajetoria(feito, p.oe, prox ? prox.h : '', { larg: 300, alt: 96 })}
      <button class="ao-vivo-acao" data-hist-prova="${t.id}:${p.id}">
        <span><small>${prox ? 'PRÓXIMO NA PISTA' : 'PROVA ' + esc(numProva(p))}</small><b>${prox ? `${esc(titulo(prox.h))} e ${esc(titulo(prox.c))}` : 'Acompanhe a prova'}</b></span>
        <span class="btn-vivo">${svg('<path d="M8 5.5v13l11-6.5z" fill="currentColor"/>', 14)} Ver</span></button>
    </section>`;
  }
  // momentos: os vencedores mais recentes
  const recentes = [];
  const limite = new Date(Date.now() - 3 * 864e5); const lim = `${limite.getFullYear()}-${pad(limite.getMonth() + 1)}-${pad(limite.getDate())}`;
  for (const t of S.dados.torneios) for (const p of t.provas || []) if (p.res && p.v && p.v.h && p.dia >= lim && p.dia <= hojeISO()) recentes.push({ t, p });
  recentes.sort((a, b) => b.p.dia.localeCompare(a.p.dia) || (minutosDe(b.p.hora) ?? 0) - (minutosDe(a.p.hora) ?? 0) || (b.p.altura || 0) - (a.p.altura || 0));
  if (recentes.length) {
    html += `<div class="secao"><h2>Momentos</h2><span class="risco"></span></div><div class="momentos">${recentes.slice(0, 4).map(({ t, p }) => {
      const x = dt(p.dia);
      return `<button class="momento" data-hist-prova="${t.id}:${p.id}">
        <span class="momento-arte">${roseta(1, 46)}</span>
        <span class="momento-texto"><small>${x.getDate()} ${MES[x.getMonth()].toUpperCase()} · ${esc(titulo(t.nome))}</small>
          <b>${esc(titulo(p.v.h))} venceu a ${fmtAlt(p.altura)}</b><span>com ${esc(titulo(p.v.c))}${seloOpp(p.v.h)}</span></span></button>`;
    }).join('')}</div>`;
  }
  return html;
}

function telaCalendario() {
  const base = S.dados.torneios.filter(t => t.fim >= hojeISO() && torneioVisivel(t)).sort((a, b) => a.inicio.localeCompare(b.inicio));
  const vazio = `<header class="capa"><div class="topo-linha"><span class="marca">${marcaSvg(26)}Salta<small>by Opportunity</small></span><button class="btn-fino" data-acao="sobre">Sobre</button></div><h1 class="grande">A temporada<br>de salto, prova a prova</h1></header>`;
  const hj = new Date();
  const capa = `<header class="hoje-cab">
      <span class="hoje-titulo"><small>${DIA_LONGO[hj.getDay()]}, ${hj.getDate()} de ${MES_LONGO[hj.getMonth()]}</small><h1>Hoje</h1></span>
      <span class="hoje-botoes"><button class="redondo" data-aba="seguindo" aria-label="Buscar e seguir">${svg('<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>', 20)}</button><button class="redondo" data-acao="sobre" aria-label="Sobre o Salta">${marcaSvg(24)}</button></span>
    </header>${blocoHoje()}
    <div class="secao"><h2>Calendário</h2><span class="risco"></span><span class="aux">${base.length} torneio${base.length > 1 ? 's' : ''}</span></div>
    ${chipsCategoria(base).replace('class="chips"', 'class="chips clara" style="padding:0 20px 12px"')}`;
  if (!base.length) return vazio + `<main><div class="vazio"><b>Nenhum torneio programado</b>O calendário é atualizado automaticamente algumas vezes por dia.</div>${rodape()}</main>`;
  const lista = aplicar(base);
  let corpo = filtros();
  if (!lista.length) corpo += semFiltro;
  else {
    let mes = '';
    lista.forEach(t => {
      const m = t.inicio.slice(0, 7);
      // fecha a lista do mês anterior antes de abrir a do próximo (sem isso cada mês ficava dentro do anterior)
      if (m !== mes) { corpo += `${mes ? '</div>' : ''}<div class="secao"><h2>${titulo(MES_LONGO[+m.slice(5) - 1])}</h2><span class="risco"></span></div><div class="lista">`; mes = m; }
      corpo += cartaoTorneio(t, false);
    });
    corpo += '</div>';
  }
  return `<main class="fade">${capa}${corpo}${rodape()}</main>`;
}

function telaResultados() {
  const base = S.dados.torneios.filter(t => t.temRes && torneioVisivel(t)).sort((a, b) => b.fim.localeCompare(a.fim));
  const cab = extra => `<header class="capa"><div class="topo-linha"><span class="marca">${marcaSvg(26)}Salta<small>by Opportunity</small></span><button class="btn-fino" data-acao="sobre">Sobre</button></div>
    <h1>Resultados</h1><span class="sub">${base.length ? base.length + ' torneios já disputados' : 'Provas de salto já disputadas'}</span>${extra}</header>`;
  if (!base.length) return cab('') + `<main><div class="vazio"><b>Ainda sem resultados</b>Eles aparecem assim que a federação publicar.</div>${rodape()}</main>`;
  const lista = aplicar(base);
  return cab(chipsCategoria(base)) + `<main class="fade">${filtros()}${lista.length ? `<div class="secao"><h2>Últimos torneios</h2><span class="risco"></span></div><div class="lista">${lista.map(t => cartaoTorneio(t, true)).join('')}</div>` : semFiltro}${rodape()}</main>`;
}

function telaTorneio() {
  const t = achar(S.torneio);
  if (!t) return telaCalendario();
  const dias = t.dias;
  if (!S.dia || !dias.includes(S.dia)) S.dia = dias.find(d => d >= hojeISO()) || dias[dias.length - 1] || null;
  const salvo = salvos.includes(t.id);
  const doDia = t.provas.filter(p => !dias.length || p.dia === S.dia)
    .sort((a, b) => String(a.hora || '~').localeCompare(String(b.hora || '~')) || String(a.numero).localeCompare(String(b.numero), 'pt', { numeric: true }));
  const maiorDoDia = doDia.reduce((a, p) => Math.max(a, p.altura ?? 0), 0);
  let corpo = `<header class="capa">
      ${voltar('voltarLista', 'Voltar')}
      <span class="olho">${t.cat.toUpperCase()} · ${(t.status || '').toUpperCase()}</span>
      <h1>${esc(titulo(t.nome))}</h1>
      <span class="sub">${esc(titulo(t.local || 'Local a confirmar'))} · ${periodoLongo(t)}</span>
      <div class="numeros">
        <div><b>${t.provas.length || '–'}</b><span>provas</span></div>
        <div><b>${dias.length || '–'}</b><span>dias</span></div>
        <div><b>${t.alturas.length ? fmtAlt(t.alturas[t.alturas.length - 1]) : '–'}</b><span>maior altura</span></div>
      </div>
      <div class="acoes">
        <button class="btn ouro" data-acao="salvar" data-id="${t.id}">★ ${salvo ? 'Torneio salvo' : 'Seguir torneio'}</button>
        <a class="btn fantasma" href="${esc(t.url)}" target="_blank" rel="noopener">Site da FPH ↗</a>
      </div>
    </header>`;
  corpo += blocoTransmissao(t);
  corpo += blocoResumo(t);
  const dest = destaqueDe(t);
  if (dest) {
    corpo += `<div class="destaque-aviso">
      <span class="chapeu">${esc(dest.selo || 'Durante o torneio')}</span>
      <span class="tit">${esc(dest.titulo || '')}</span>
      ${dest.quando ? `<span class="quando">${esc(dest.quando)}</span>` : ''}
      ${dest.texto ? `<span class="txt">${esc(dest.texto)}</span>` : ''}
      ${dest.link ? `<a class="btn ouro" href="${esc(dest.link)}" target="_blank" rel="noopener">${esc(dest.botao || 'Ver catálogo')} ↗</a>` : ''}
    </div>`;
  }
  if (!t.provas.length) return corpo + `<main class="fade"><div class="vazio"><b>Programação em breve</b>A federação ainda não publicou as provas deste torneio.</div></main>`;
  corpo += '<main class="fade">';
  if (dias.length > 1) {
    corpo += `<div class="dias" role="group" aria-label="Dias do torneio">${dias.map(d => {
      const x = dt(d);
      return `<button class="dia" data-dia="${d}" aria-pressed="${d === S.dia}">${DIA_CURTO[x.getDay()]}<b>${x.getDate()}</b></button>`;
    }).join('')}</div>`;
  }
  const x = S.dia ? dt(S.dia) : null;
  corpo += `<div class="secao"><h2>${x ? `${DIA_LONGO[x.getDay()]}, ${x.getDate()} de ${MES_LONGO[x.getMonth()]}` : 'Provas'}</h2><span class="risco"></span><span class="aux">${doDia.length} prova${doDia.length > 1 ? 's' : ''}</span></div>`;
  corpo += `<div class="lista">${doDia.map(p => {
    const dest = p.altura && p.altura === maiorDoDia && doDia.length > 1;
    const info = [p.hora, p.pista ? 'Pista ' + titulo(p.pista) : ''].filter(Boolean).join(' · ');
    const parcial = p.res && p.oe && p.n && p.n < p.oe && p.dia >= hojeISO();
    const corpoProva = p.res && p.v
      ? `<span class="tag">${parcial ? `LIDERANDO · ${p.n} DE ${p.oe} JÁ SALTARAM` : 'VENCEDOR'}${dest ? ' · MAIOR PROVA DO DIA' : ''}</span><span class="venc">${esc(titulo(p.v.c))}</span><span class="meta">${esc(titulo(p.v.h))}${info ? ' · ' + esc(info) : ''}</span>`
      : `<span class="tag">${esc(titulo(p.nome || 'A realizar'))}${dest ? ' · MAIOR PROVA DO DIA' : ''}</span><span class="venc">${
          p.oe ? `${p.oe} conjunto${p.oe > 1 ? 's' : ''} inscrito${p.oe > 1 ? 's' : ''}` : (p.ni ? `${p.ni} conjunto${p.ni > 1 ? 's' : ''} inscrito${p.ni > 1 ? 's' : ''}` : (p.dia && p.dia < hojeISO() ? 'Resultado ainda não publicado' : 'Ainda não disputada'))
        }</span><span class="meta">${esc(info || 'Horário a confirmar')}${p.oe ? ' · ver ordem de entrada' : (p.ni ? ' · ver inscritos' : '')}</span>`;
    const abre = p.res || p.oe || p.ni;
    return `<button class="prova${dest ? ' destaque' : ''}" ${abre ? `data-prova="${p.id || 'n' + p.numero}"` : 'disabled aria-disabled="true"'}>
      <span class="alt"><b>${p.altura != null ? p.altura.toFixed(2).replace('.', ',') : '–'}</b><span>PROVA ${numProva(p)}</span></span>
      <span class="corpo">${corpoProva}</span>
      ${abre ? seta : ''}
    </button>`;
  }).join('')}</div>`;
  if (t.ocultas) corpo += `<p class="fonte" style="padding-top:12px">${t.ocultas} prova${t.ocultas > 1 ? 's' : ''} sem inscritos ou sem resultado publicado ${t.ocultas > 1 ? 'não aparecem' : 'não aparece'} aqui. <a href="${esc(t.url)}" target="_blank" rel="noopener">Ver programação completa na FPH ↗</a></p>`;
  return corpo + rodape() + '</main>';
}

function telaProva() {
  const t = achar(S.torneio), p = acharProva(t, S.prova);
  if (!p) return telaTorneio();
  const x = p.dia ? dt(p.dia) : null;
  const cab = `<header class="capa">
      ${voltar('voltarTorneio', titulo(t.nome))}
      <span class="olho">PROVA ${numProva(p)}${x ? ` · ${DIA_LONGO[x.getDay().toString()] || ''}, ${x.getDate()} DE ${MES_LONGO[x.getMonth()].toUpperCase()}` : ''}</span>
      <h1>${p.altura != null ? p.altura.toFixed(2).replace('.', ',') + (p.altura === 1 ? ' metro' : ' metros') : esc(titulo(p.nome))}</h1>
      <span class="sub">${esc([/^\d[,.]\d{2}\s*M$/i.test((p.nome || '').trim()) ? '' : titulo(p.nome), p.hora, p.pista ? 'Pista ' + titulo(p.pista) : ''].filter(Boolean).join(' · '))}</span>`;
  const dados = S.torneios[t.id];
  if (!dados || dados === 'carregando') { carregarTorneio(t.id); return cab + '</header><main><div class="vazio">Carregando resultado…</div></main>'; }
  if (dados === 'erro') return cab + `</header><main><div class="vazio"><b>Não deu para carregar</b><button class="btn clara" style="margin-top:12px;flex:none" data-acao="recarregarProva">Tentar de novo</button></div></main>`;
  if (!p.res) {
    const ordem = (p.id && (dados.ordem || {})[String(p.id)]) || [];
    const inscritos = ((dados.inscritos || {})[String(p.numero).toUpperCase()]) || [];
    return cab + '</header>' + (ordem.length || !inscritos.length ? telaOrdem(p, ordem) : telaInscritos(p, inscritos));
  }
  const linhas = dados.provas[String(p.id)] || [];
  const fed = i => i != null ? dados.fed[i] : null;
  const q = S.filtro.trim().toLowerCase();

function montarNovidades() {
  const out = [];

  for (const s of seguindo) {
    const p = perfilDe(s.tipo, s.k);
    if (!p || typeof p !== 'object') { carregarPerfil(s.tipo, s.k); continue; }
    for (const h of (p.hist || []).slice(0, 3)) {

      out.push({

        texto: `${titulo(p.nome)} ficou em ${pos}º na prova de ${fmtAlt(h.a)}${h.h ? ' com ' + titulo(h.h) : (h.c ? ' com ' + titulo(h.c) : '')}`,

      });
    }
  }
  return out.sort((a, b) => b.d.localeCompare(a.d)).slice(0, 8);
}

const listaCriacao = tipo => tipo === 'garanhoes' || tipo === 'garanhao' ? S.criacao.pais : (tipo === 'matrizes' || tipo === 'matriz' ? (S.criacao.maes || []) : S.criacao.criadores);
const notaFonte = txt => `<p class="fonte nota-fonte"><span class="selo-fonte">Calculado pelo Salta</span>${esc(txt)} <button class="link-ficha" data-acao="metodo">Como calculamos</button></p>`;
const coberturaTxt = () => criacaoPronta() ? ` Até agora, ${S.criacao.cobertura.comFicha.toLocaleString('pt-BR')} de ${S.criacao.cobertura.total.toLocaleString('pt-BR')} cavalos da temporada têm ficha; o número cresce a cada coleta.` : '';

// lista de garanhões ou de criadores, ordenada pelas vitórias dos cavalos em pista
function rankingCriacao(tipo) {
  if (!criacaoPronta()) { carregarArquivo('criacao', 'criacao.json'); return `<main><div class="vazio">${S.criacao === 'erro' ? 'Os dados de criação aparecem depois da próxima coleta.' : 'Carregando…'}</div></main>`; }
  const lista = listaCriacao(tipo).slice(0, 100);
  if (!lista.length) return `<main><div class="vazio">Ainda não há fichas suficientes. Os dados aparecem conforme o coletor lê as ordens de entrada.</div></main>`;
  let pos = 0, ult = null;
  const titulos = { garanhoes: 'Garanhões pelos filhos em pista', matrizes: 'Matrizes pelos filhos em pista', criadores: 'Criadores pelos cavalos em pista' };
  const atr = { garanhoes: 'data-garanhao', matrizes: 'data-matriz', criadores: 'data-haras' }[tipo];
  return `<main class="fade"><div class="secao"><h2>${titulos[tipo]}</h2><span class="risco"></span></div>
    <div class="podio">${lista.map((g, i) => {
      if (g.v !== ult) { pos = i + 1; ult = g.v; }
      const n = g.cavalos.length;
      return `<button class="linha-podio" ${atr}="${esc(g.k)}">
        ${pos <= 3 && g.v > 0 ? roseta(pos, 38) : `<span style="width:38px;flex:none;text-align:center;font-family:var(--serif);font-size:20px;color:var(--muted)">${pos}</span>`}

          <span class="nome">${esc(titulo(g.nome))}${g.vendido ? '<span class="selo-opp" title="Vendido pela Opportunity Leilões">Opportunity</span>' : ''}${tipo === 'garanhoes' ? seloWbfsh(g.k) : ''}</span>
          <span class="meta">${n} ${tipo === 'criadores' ? (n > 1 ? 'cavalos' : 'cavalo') : (n > 1 ? 'filhos' : 'filho')} em pista · ${g.l} largadas${g.max ? ' · até ' + fmtAlt(g.max) : ''}${g.destaques ? ` · ${g.destaques} no pódio a ${fmtAlt(S.criacao.alturaDestaque || 1.4)}+` : ''}</span></span>
        <span class="res"><b>${g.v}</b><span>vitórias</span></span></button>`;
    }).join('')}</div>
    ${notaFonte(` A partir dos resultados públicos da FPH e do ${{ garanhoes: 'pai', matrizes: 'mãe', criadores: 'criador' }[tipo]} informado na ficha de cada cavalo.${coberturaTxt()}`)}
  </main>`;
}
// página de um garanhão ou de um haras, com os cavalos em pista
function telaCriacao(tipo) {
  const k = { garanhao: S.garanhaoK, matriz: S.matrizK, haras: S.harasK }[tipo];
  const cab = nome => capaPerfil(nome, { garanhao: 'GARANHÃO', matriz: 'MATRIZ', haras: 'CRIADOR' }[tipo], tipo === 'haras' ? 'verde' : 'ouro', 'voltarCriacao');

  const g = listaCriacao(tipo).find(x => x.k === k);
  if (!g) return cab(k) + '</div><div class="vazio">Sem cavalos em pista nesta temporada.</div></main>';
  const base = S.criacao.cavalos;
  const cavs = g.cavalos.map(ck => ({ k: ck, d: base[ck] })).filter(x => x.d).sort((a, b) => b.d[2] - a.d[2] || b.d[3] - a.d[3] || b.d[1] - a.d[1]);
  const extra = tipo === 'haras' && S.haras && typeof S.haras === 'object' ? S.haras[k] : null;
  const venda = tipo !== 'haras' && vendidoDe(g.nome);
  const filhosTxt = tipo === 'haras' ? (cavs.length > 1 ? 'cavalos' : 'cavalo') : (cavs.length > 1 ? 'filhos' : 'filho');
  const w = tipo === 'garanhao' ? wbfshDe(k) : null;
  const posSalta = posicaoEm(listaCriacao(tipo), k);
  let html = cab(g.nome) + `<span class="pf-sub">${cavs.length} ${filhosTxt} em pista na temporada</span>
    ${venda ? `<span class="venda-opp pf-venda">${marcaSvg(18)}<span>Vendido pela Opportunity · ${esc(titulo(venda.leilao))}${venda.ano ? ', ' + venda.ano : ''}</span></span>` : ''}
    ${extra && extra.site ? `<a class="link-ficha pf-sub" href="${esc(extra.site)}" target="_blank" rel="noopener">Site do haras ↗</a>` : ''}
    </div>
    ${extra && extra.texto ? `<p class="prosa-haras">${esc(extra.texto)}</p>` : ''}
    ${tipo === 'garanhao' ? `<div class="reguas">
      <div class="regua"><span class="olho-r">NO MUNDO</span>${w ? `<b>${w.pos}º</b><span>ranking WBFSH ${S.wbfsh.ano} · ${w.pontos.toLocaleString('pt-BR')} pontos</span><a href="${esc(S.wbfsh.fonte)}" target="_blank" rel="noopener">Fonte: WBFSH, resultados internacionais FEI ↗</a>` : `<b>–</b><span>fora do top 100 da WBFSH ${S.wbfsh && S.wbfsh.ano ? S.wbfsh.ano : ''}</span>`}</div>
      <div class="regua"><span class="olho-r">NO SALTA</span><b>${posSalta ? posSalta + 'º' : '–'}</b><span>pelos filhos nas provas da FPH · ${g.v} vitórias</span><span class="selo-fonte">Calculado pelo Salta</span></div>
    </div>` : ''}
    <div class="stats"><div><b>${cavs.length}</b><span>${tipo === 'haras' ? 'cavalos' : 'filhos'}</span></div><div><b>${g.l}</b><span>largadas</span></div><div><b style="color:var(--ouro-escuro)">${g.v}</b><span>vitórias</span></div><div><b>${g.po}</b><span>pódios</span></div></div>
    <div class="secao"><h2>${tipo === 'haras' ? 'Cavalos em pista' : 'Filhos em pista'}</h2><span class="risco"></span></div>
    <div class="podio">${cavs.map(({ k: ck, d }) => `<button class="linha-podio" data-perfil="cavalos" data-k="${esc(ck)}">
        <span style="flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:2px">
          <span class="nome">${esc(titulo(d[0]))}${seloOpp(d[0])}</span>
          <span class="meta">${d[1]} largadas${d[4] ? ' · até ' + fmtAlt(d[4]) : ''}${d[8] ? ` · <span class="dest">pódio a ${fmtAlt(S.criacao.alturaDestaque || 1.4)}+</span>` : ''}</span>${filiacaoDe(d[0], { pai: d[5], mae: d[6] })}</span>
        <span class="res"><b>${d[2]}</b><span>vitórias</span></span></button>`).join('')}</div>
    ${tipo === 'haras' && !extra ? `<div class="painel convite"><h3>Este é o seu haras?</h3><p>Destaque o perfil com o logotipo, uma apresentação e o contato do haras. Fale com a Opportunity.</p>
      <a class="btn ouro" href="mailto:contato@opportunityleiloes.com.br?subject=${encodeURIComponent('Salta · destacar o perfil do ' + titulo(g.nome))}">Pedir destaque do perfil</a></div>` : ''}
    ${notaFonte(` A partir dos resultados públicos da FPH e do ${{ garanhao: 'pai', matriz: 'mãe', haras: 'criador' }[tipo]} informado na ficha de cada cavalo.${coberturaTxt()}`)}
  </main>`;
  return html;

// resumo do torneio, montado só com fatos dos dados
function blocoResumo(t) {
  if (S.resumos === undefined) carregarArquivo('resumos', 'resumos.json');
  const r = S.resumos && typeof S.resumos === 'object' ? S.resumos[String(t.id)] : null;
  if (!r) return '';
  const alt = r.altMin && r.altMax ? (r.altMin === r.altMax ? ` a ${fmtAlt(r.altMax)}` : `, de ${fmtAlt(r.altMin)} a ${fmtAlt(r.altMax)}`) : '';
  const frases = [];
  frases.push(`${r.parcial ? 'Até agora, o torneio teve' : 'O torneio teve'} ${r.provas} ${r.provas > 1 ? 'provas com resultado' : 'prova com resultado'}${alt}, com ${r.largadas.toLocaleString('pt-BR')} largadas de ${r.conjuntos.toLocaleString('pt-BR')} conjuntos.`);
  if (r.topCav && r.topCav.length) frases.push(`Quem mais venceu foi ${esc(titulo(r.topCav[0].nome))}, com ${r.topCav[0].v} vitórias${r.topCav[1] ? `, seguido de ${esc(titulo(r.topCav[1].nome))}, com ${r.topCav[1].v}` : ''}.`);
  if (r.maior) frases.push(`Na prova mais alta, a ${fmtAlt(r.maior.a)}, ${r.maior.empate > 1 ? `${r.maior.empate} conjuntos dividiram o primeiro lugar, entre eles ${esc(titulo(r.maior.c))} com ${esc(titulo(r.maior.h))}` : `venceu ${esc(titulo(r.maior.c))} com ${esc(titulo(r.maior.h))}`}.`);
  if (r.zeroPct != null) frases.push(`${r.zeroPct}% dos percursos terminaram sem faltas.`);
  if (r.topCriador) frases.push(`Entre os criadores, ${esc(titulo(r.topCriador.nome))} somou mais vitórias, com ${r.topCriador.v}.`);
  if (r.opp) frases.push(`Os cavalos vendidos pela Opportunity largaram ${r.opp.l} ${r.opp.l > 1 ? 'vezes' : 'vez'}${r.opp.v ? ` e venceram ${r.opp.v} ${r.opp.v > 1 ? 'provas' : 'prova'}` : ''}.`);
  return `<section class="resumo-torneio"><div class="secao" style="padding-left:0;padding-right:0"><h2>${r.parcial ? 'O torneio até agora' : 'Resumo do torneio'}</h2><span class="risco"></span></div>
    <p>${frases.join(' ')}</p><span class="selo-fonte">Calculado pelo Salta a partir dos resultados da FPH</span></section>`;
}

  return capa + corpo;
}

  render();
}

const corpoOpp = (o, vista, q) => vista === 'cavalos' ? oppPorCavalo(o, q) : (vista === 'filhos' ? oppFilhos(o, q) : oppPorProva(o, q));
// cavalos em pista cujo pai ou mãe foi vendido pela Opportunity

  }).join('')}</div>`;

// agrupa as largadas por prova: um cartão por prova, com todos os cavalos vendidos que saltaram nela
function agruparPorProva(itens) {
  const grupos = [], porChave = new Map();
  for (const x of itens) {
    const g = `${x.ti}:${x.pid || 'n' + x.pn}`;
    if (!porChave.has(g)) { const novo = { ...x, cavalos: [] }; porChave.set(g, novo); grupos.push(novo); }
    porChave.get(g).cavalos.push(x);
  }
  return grupos;
}
function cartaoProvaOpp(g, futuro) {
  const x = dt(g.d);
  return `<button class="cartao-opp" data-abrir-prova="${g.ti}:${g.pid || 'n' + g.pn}">
    <span class="topo-opp"><b>${futuro ? (g.hora ? g.hora + ' · ' : '') : ''}${x.getDate()} ${MES[x.getMonth()]}</b> · Prova ${esc(String(g.pn || '').replace(/^0+(?=\d)/, ''))} · ${fmtAlt(g.a)}</span>
    <span class="torneio-opp">${esc(titulo(g.t))}</span>
    ${g.cavalos.map(c => {
      const perc = c.r && c.r[0];
      const res = futuro
        ? `<span class="res-opp">${c.o ? `entra em ${c.o}º de ${c.n}` : `inscrito · ${c.n} na prova`}</span>`
        : (c.s ? `<span class="res-opp">${esc(c.s)}</span>`
               : `<span class="res-opp"><b style="color:${c.p === 1 ? 'var(--ouro-escuro)' : (c.p <= 3 ? 'var(--bronze)' : 'var(--ink)')}">${c.p}º</b> de ${c.n}${perc ? ' · ' + fmtN(perc[0]) + ' flt' : ''}</span>`);
      return `<span class="linha-opp"><span class="cav-opp"><b>${esc(titulo(c.h))}</b><span>${esc(titulo(c.c))}</span>${filiacaoDe(c.h)}</span>${res}</span>`;
    }).join('')}
    ${seta}
  </button>`;
}
function oppPorProva(o, q) {
  const filtra = l => q ? l.filter(x => x.h.toLowerCase().includes(q)) : l;
  const prox = agruparPorProva(filtra(o.proximas || []));
  const feitas = agruparPorProva(filtra(o.participacoes || []));
  let html = '';
  if (prox.length) html += `<div class="secao"><h2>Próximas largadas</h2><span class="risco"></span><span class="aux">${prox.length} prova${prox.length > 1 ? 's' : ''}</span></div>
    <div class="lista">${prox.map(g => cartaoProvaOpp(g, true)).join('')}</div>`;
  if (feitas.length) {
    // mostra primeiro as 40 provas mais recentes; o resto aparece ao buscar pelo nome
    const mostrar = q ? feitas : feitas.slice(0, 40);
    html += `<div class="secao"><h2>Resultados</h2><span class="risco"></span><span class="aux">${feitas.length} provas</span></div>
      <div class="lista">${mostrar.map(g => cartaoProvaOpp(g, false)).join('')}</div>
      ${!q && feitas.length > mostrar.length ? `<p class="fonte">Mostrando as ${mostrar.length} provas mais recentes. Busque pelo nome do cavalo para ver o histórico completo dele.</p>` : ''}`;
  }
  return html || `<div class="vazio">Nenhuma largada encontrada${q ? ' para esse nome' : ''}.</div>`;
}

// ---------- capa no padrão novo: faixa colorida com o arco do salto, avatar sobreposto e ação à direita ----------
// devolve a capa e abre o bloco de identidade (.pf-id); quem chama completa, fecha o </div> e o </main>
function capaPerfil(nome, rotulo, cor, acaoVoltar, acao = '') {
  return `<header class="pf-capa pf-${cor}">
      <svg class="pf-arco" viewBox="0 0 390 200" preserveAspectRatio="none" fill="none" aria-hidden="true"><path d="M-20 196C40 70 140 34 210 34s150 46 200 162" stroke="#D9B45A" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.1 13" opacity=".75"/></svg>
      <div class="pf-topo"><button class="pf-voltar" data-acao="${acaoVoltar}" aria-label="Voltar">${svg('<path d="m15 5-7 7 7 7"/>', 22)}</button></div>
    </header><main class="fade pf-main"><div class="pf-id">
      <div class="pf-linha">${avatar(nome, 96)}${acao}</div>
      <span class="pf-olho">${rotulo}</span>
      <h1 class="pf-nome">${esc(titulo(nome))}</h1>`;
}
// um momento da temporada, em forma de cartão na linha do tempo
function cartaoMomento(h) {
  const x = dt(h.d), fases = h.r || [];
  const faltas = fases.reduce((s, f) => s + (f[0] || 0), 0);
  const tempo = fases.length ? fases[fases.length - 1][1] : null;
  const alt = fmtAlt(h.a), zerouPrimeira = fases.length && (fases[0][0] || 0) === 0;
  let tit;
  if (h.s) tit = `${titulo(h.s)} na ${alt}`;
  else if (h.p <= 3) tit = `${h.p}º lugar na ${alt}`;
  else if (zerouPrimeira) tit = fases.length > 1 ? `Zerou a 1ª fase da ${alt}` : `Zerou a ${alt}`;
  else tit = `${h.p}º lugar na ${alt}`;
  const det = [
    !h.s && fases.length ? `${fases.length > 1 ? fases.map(f => f[0] || 0).join(' + ') + ' faltas' : `${faltas} falta${faltas === 1 ? '' : 's'}`}${tempo ? ' · ' + String(tempo).replace('.', ',') + 's' : ''}` : '',
    !h.s && h.p > 3 ? `${h.p}º de ${h.n}` : `${h.n} conjuntos`,
    (h.h || h.c) ? 'com ' + titulo(h.h || h.c) : '',
  ].filter(Boolean).join(' · ');
  const top = !h.s && h.p <= 3;
  return `<button class="tl-card${top ? ' top' : ''}" ${h.pid ? `data-hist-prova="${h.ti}:${h.pid}"` : `data-torneio="${h.ti}"`}>
      <span class="tl-ponto" aria-hidden="true"></span>
      <span class="tl-corpo"><small>${x.getDate()} ${MES[x.getMonth()].toUpperCase()} · ${esc(titulo(h.t))}</small><b>${esc(tit)}</b><span>${esc(det)}</span></span>
      ${top ? roseta(h.p, 30) : ''}</button>`;
}

function telaPerfil() {
  const tipo = S.perfilTipo, k = S.perfilK;
  const p = perfilDe(tipo, k);
  const pessoa = tipo === 'cavaleiros';
  const cor = pessoa ? 'verde' : 'terra';
  const rot = pessoa ? 'CAVALEIRO' : 'CAVALO';
  if (!p || p === 'carregando') { carregarPerfil(tipo, k); return capaPerfil(titulo(k), rot, cor, 'voltarPerfil') + '</div><div class="vazio">Carregando perfil…</div></main>'; }
  if (p === 'erro' || p === 'ausente') return capaPerfil(titulo(k), rot, cor, 'voltarPerfil') + `</div><div class="vazio"><b>Sem dados por enquanto</b>Este perfil aparece assim que houver resultados coletados de 2026.</div></main>`;
  const seguido = estaSeguindo(tipo, k);
  const pct = p.l ? Math.round(p.z / p.l * 100) : 0;
  const alturas = Object.entries(p.alt || {}).sort((a, b) => b[0].localeCompare(a[0]));
  const maxL = Math.max(1, ...alturas.map(([, v]) => v[0]));
  const venda = !pessoa && vendidoDe(p.nome);
  const f = (!pessoa && p.ficha) || {};
  const acao = `<button class="pf-acao${seguido ? ' on' : ''}" data-acao="seguir" data-tipo="${tipo}" data-k="${esc(k)}" data-nome="${esc(p.nome)}">${svg('<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z" stroke-linejoin="round"/>', 16)} ${seguido ? 'Seguindo' : 'Seguir'}</button>`;
  // linha de identidade: filiação, raça, ano e criador; ou federação e parceiro
  const sub = pessoa
    ? [p.fed ? esc(p.fed) : '', p.par?.length ? 'Monta ' + esc(titulo(p.par[0].n)) : ''].filter(Boolean).join(' · ')
    : [f.pai || f.mae ? `${f.pai ? `<button class="link-ficha" data-garanhao="${esc(chave(f.pai))}">${esc(titulo(f.pai))}</button>` : '?'} × ${f.mae ? `<button class="link-ficha" data-matriz="${esc(chave(f.mae))}">${esc(titulo(f.mae))}</button>` : '?'}` : '',
       f.raca ? esc(f.raca) : '', f.nasc ? f.nasc.slice(0, 4) : ''].filter(Boolean).join(' · ');
  const sub2 = pessoa ? '' : [p.par?.length ? 'Montado por ' + esc(titulo(p.par[0].n)) : '', f.criador ? `criado por <button class="link-ficha" data-haras="${esc(chave(f.criador))}">${esc(titulo(f.criador))}</button>` : ''].filter(Boolean).join(' · ');
  let corpo = capaPerfil(p.nome, rot, cor, 'voltarPerfil', acao)
    + (sub ? `<span class="pf-sub">${sub}</span>` : '') + (sub2 ? `<span class="pf-sub">${sub2}</span>` : '')
    + (venda ? `<span class="venda-opp pf-venda">${marcaSvg(18)}<span>Vendido pela Opportunity · ${esc(titulo(venda.leilao))}${venda.ano ? ', ' + venda.ano : ''}</span></span>` : '')
    + `</div>
    <div class="aneis">
      ${anelDesempenho(pct + '%', pct / 100, 'sem faltas')}
      ${anelDesempenho(p.v, p.l ? p.v / p.l : 0, `vitória${p.v === 1 ? '' : 's'} em ${p.l}`)}
      ${anelDesempenho(p.po, p.l ? p.po / p.l : 0, `pódio${p.po === 1 ? '' : 's'}`)}
      ${anelDesempenho(alturas.length ? fmtAlt(+alturas[0][0]).replace('m', '') : '–', alturas.length ? Math.min(1, +alturas[0][0] / 1.6) : 0, 'maior altura', true)}
    </div>`;
  // abas: momentos, resultados e família (ou cavalos, para cavaleiros)
  const abas = [['momentos', 'Momentos'], ['resultados', 'Resultados'], ['familia', pessoa ? 'Cavalos' : 'Família']];
  const aba = abas.some(([a]) => a === S.abaPerfil) ? S.abaPerfil : 'momentos';
  corpo += `<div class="pf-abas" role="tablist">${abas.map(([a, t]) => `<button role="tab" data-aba-perfil="${a}" aria-selected="${aba === a}">${t}</button>`).join('')}</div>`;
  const hist = p.hist || [];
  if (aba === 'momentos') {
    corpo += hist.length ? `<div class="tl">${hist.slice(0, 30).map(cartaoMomento).join('')}</div>${hist.length > 30 ? `<p class="fonte">Mostrando os 30 momentos mais recentes. A lista completa está em Resultados.</p>` : ''}`
      : '<div class="vazio">Nenhuma largada registrada na temporada.</div>';
  } else if (aba === 'resultados') {
    if (alturas.length) {
      corpo += `<div class="painel"><h3>Desempenho por altura</h3>
        ${alturas.map(([a, [l, v]]) => `<div class="barra">
          <span class="rot">${a.replace('.', ',')}</span>
          <span class="trilho"><i class="v" style="width:${v / maxL * 100}%"></i><i class="o" style="width:${(l - v) / maxL * 100}%"></i></span>
          <span class="num">${l} · ${v}</span></div>`).join('')}
        <div class="legenda"><span><i style="background:var(--ouro)"></i>vitórias</span><span><i style="background:var(--verde-3)"></i>outras largadas</span></div></div>`;
    }
    corpo += `<div class="secao"><h2>Todas as largadas</h2><span class="risco"></span><span class="aux">${hist.length}</span></div><div class="tabela">${hist.map(h => {
      const x = dt(h.d);
      return `<button class="linha" ${h.pid ? `data-hist-prova="${h.ti}:${h.pid}"` : `data-torneio="${h.ti}"`}>
        <span class="pos" style="color:${h.p === 1 ? 'var(--ouro-escuro)' : (h.p <= 3 ? 'var(--bronze)' : 'var(--muted)')}">${h.s ? '–' : h.p + 'º'}</span>
        <span class="conj"><span class="cav">${fmtAlt(h.a)}${h.h ? ' com ' + esc(titulo(h.h)) : (h.c ? ' com ' + esc(titulo(h.c)) : '')}${h.s ? ' · ' + esc(h.s) : ''}</span>
        <span class="cavalo">${x.getDate()} ${MES[x.getMonth()]} · ${esc(titulo(h.t))} · ${h.n} conjuntos</span></span>${seta}</button>`;
    }).join('')}</div>`;
  } else {
    if (pessoa) {
      corpo += p.par?.length ? `<div class="pf-pares">${p.par.map(x => `<button class="pf-par" data-perfil="cavalos" data-k="${esc(chave(x.n))}">${avatar(x.n, 52)}<span><b>${esc(titulo(x.n))}</b><small>${x.q} largada${x.q > 1 ? 's' : ''} juntos</small>${filiacaoDe(x.n)}</span></button>`).join('')}</div>`
        : '<div class="vazio">Nenhum cavalo registrado na temporada.</div>';
    } else {
      corpo += (f.pai || f.mae || f.criador) ? blocoFamilia(f) : '<div class="vazio">A FPH ainda não informou a filiação deste cavalo.</div>';
      if (p.par?.length) corpo += `<div class="secao"><h2>Cavaleiros</h2><span class="risco"></span></div><div class="pf-pares">${p.par.map(x => `<button class="pf-par" data-perfil="cavaleiros" data-k="${esc(chave(x.n))}">${avatar(x.n, 52)}<span><b>${esc(titulo(x.n))}</b><small>${x.q} largada${x.q > 1 ? 's' : ''} juntos</small></span></button>`).join('')}</div>`;
    }
  }
  corpo += `${p.prot ? '<p class="fonte">O sobrenome está abreviado porque as provas deste atleta são de categorias infantis.</p>' : ''}</main>`;
  return corpo;
}

function anelDesempenho(valor, fr, rot, verde) {
  const r = 24, c = 2 * Math.PI * r;
  return `<span class="anel"><span class="anel-g"><svg width="60" height="60" viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="${r}" class="anel-fundo" stroke-width="5" fill="none"/><circle cx="30" cy="30" r="${r}" class="${verde ? 'anel-verde' : 'anel-ouro'}" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="${(c * Math.max(0, Math.min(1, fr))).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 30 30)"/></svg><b>${esc(String(valor))}</b></span><span class="anel-rot">${esc(rot)}</span></span>`;
}
// família do cavalo no perfil: pai, mãe e criador, cada um levando à sua página
function blocoFamilia(f) {
  if (S.criacao === undefined) carregarArquivo('criacao', 'criacao.json');
  const c = criacaoPronta() ? S.criacao : null;
  const item = (rot, nome, tipo, atr) => {
    if (!nome) return '';
    const k = chave(nome), lista = c ? listaCriacao(tipo) : [];
    const g = lista.find(x => x.k === k), pos = g ? posicaoEm(lista, k) : null;
    const n = g ? g.cavalos.length : 0;
    return `<button class="fam" ${atr}="${esc(k)}"><span class="olho-r">${rot}</span><b>${esc(titulo(nome))}</b>
      <span>${g ? `${n} ${tipo === 'haras' ? (n > 1 ? 'cavalos' : 'cavalo') : (n > 1 ? 'filhos' : 'filho')} em pista · ${g.v} ${g.v === 1 ? 'vitória' : 'vitórias'}${pos && g.v > 0 ? ` · ${pos}º no Salta` : ''}` : (c ? 'sem outros filhos em pista' : '…')}</span>
      ${tipo === 'garanhao' ? seloWbfsh(k) : ''}</button>`;
  };
  return `<div class="secao"><h2>Família</h2><span class="risco"></span></div><div class="familia">
    ${item('PAI', f.pai, 'garanhao', 'data-garanhao')}${item('MÃE', f.mae, 'matriz', 'data-matriz')}${item('CRIADOR', f.criador, 'haras', 'data-haras')}</div>`;
}

// ---------- como calculamos ----------

  const sec = (t, txt) => `<section class="metodo"><h2>${t}</h2>${txt}</section>`;
  return `<header class="capa">${voltar('voltarMetodo', 'Voltar')}<span class="olho">TRANSPARÊNCIA</span><h1>Como calculamos</h1>
    <span class="sub">Método ${criacaoPronta() ? esc(S.criacao.metodo) : 'v1'}. Todo número do Salta pode ser refeito a partir dos resultados oficiais.</span></header>
    <main class="fade">
